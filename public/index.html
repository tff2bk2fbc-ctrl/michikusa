<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Spota</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif}
button,input{font-family:inherit;color:inherit;border:none;background:none;outline:none}
button{cursor:pointer}

/* 昼 */
body{--bg:#EFEDE8;--sf:#FFFFFF;--ink:#111111;--dim:#787878;--line:#E6E4E0;
  --ring:#FFFFFF;--chip:#F0F0F0;--btn:#111111;--btnink:#FFFFFF;--warn:#D93025;
  --sh:0 2px 10px rgba(0,0,0,.14);--sh2:0 -4px 26px rgba(0,0,0,.12);
  background:var(--bg);color:var(--ink);transition:background .4s,color .4s}
/* 夜 */
body.dark{--bg:#1E2A29;--sf:#26332F;--ink:#F0F4F2;--dim:#9DAAA6;--line:#38443F;
  --ring:#1E2A29;--chip:#36443F;--btn:#F0F4F2;--btnink:#1E2A29;--warn:#FF6B60;
  --sh:0 2px 12px rgba(0,0,0,.55);--sh2:0 -4px 30px rgba(0,0,0,.55)}

#map{position:fixed;inset:0}

/* ---------- 起動画面 ---------- */
#splash{position:fixed;inset:0;z-index:5000;background:var(--bg);color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .55s ease,visibility .55s}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none}
.sp-in{text-align:center;animation:spIn .7s cubic-bezier(.2,.9,.25,1)}
@keyframes spIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.sp-mark{width:78px;height:78px;display:block;margin:0 auto 18px;
  animation:spBeat 2.4s ease-in-out infinite}
@keyframes spBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.sp-nm{font-size:30px;font-weight:700;letter-spacing:.06em}
.sp-sb{font-size:12.5px;opacity:.55;margin-top:9px;letter-spacing:.14em}

#err{position:fixed;top:0;left:0;right:0;z-index:9999;background:#7A2118;color:#FFE8E4;
  font:11px/1.6 ui-monospace,Menlo,monospace;padding:12px 14px;display:none;
  white-space:pre-wrap;max-height:45%;overflow:auto}
#err b{color:#FFC24B}

/* ---------- 上 ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:40;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:8px}
.q{flex:1;display:flex;align-items:center;gap:8px;background:var(--sf);border-radius:999px;
  padding:11px 15px;box-shadow:var(--sh);transition:background .4s;min-width:0}
.q svg{width:16px;height:16px;color:var(--dim);flex:0 0 16px}
.q input{flex:1;font-size:14.5px;min-width:0;background:none}
.q input::placeholder{color:var(--dim)}
.q .x{color:var(--dim);font-size:16px;display:none;flex:0 0 auto}
.rb{width:42px;height:42px;border-radius:50%;background:var(--sf);box-shadow:var(--sh);
  display:flex;align-items:center;justify-content:center;flex:0 0 42px;overflow:hidden;
  transition:background .4s}
.rb svg{width:19px;height:19px}
.rb b{font-size:15px;font-weight:700}

.results{position:fixed;left:12px;right:12px;z-index:41;
  top:calc(env(safe-area-inset-top,0px) + 62px);background:var(--sf);border-radius:16px;
  box-shadow:var(--sh);overflow:hidden;display:none;max-height:56vh;overflow-y:auto}
.results.on{display:block}
.res{display:flex;gap:11px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:none}
.res .ic{width:34px;height:34px;border-radius:50%;flex:0 0 34px;background:var(--chip);
  background-size:cover;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:var(--dim)}
.res .tx{flex:1;min-width:0}
.res .tx b{display:block;font-size:14px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .tx span{font-size:11.5px;color:var(--dim);display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reshead{padding:9px 14px;font-size:11px;color:var(--dim);background:var(--chip)}

/* ---------- 写真ピン ---------- */
.pn{position:relative;cursor:pointer}
.pn .im{border-radius:50%;border:3px solid var(--ring);box-shadow:var(--sh);
  background-color:var(--chip)}
.pn .tl{position:absolute;left:50%;bottom:-4px;width:9px;height:9px;background:var(--ring);
  transform:translateX(-50%) rotate(45deg);border-radius:1px;box-shadow:var(--sh);z-index:-1}


/* ---------- 下：カード ---------- */

/* ---------- 丸ボタン ---------- */
.fabs{position:fixed;left:0;right:0;bottom:0;z-index:36;
  display:flex;align-items:flex-end;justify-content:center;gap:22px;
  padding:0 20px calc(env(safe-area-inset-bottom,0px) + 14px);
  transition:transform .32s cubic-bezier(.2,.9,.25,1),opacity .28s}
.fabs.hide{transform:translateY(150%);opacity:0;pointer-events:none}
.fabpull{position:fixed;left:0;right:0;bottom:0;height:56px;z-index:37;display:none}
.fabpull.on{display:block}
.fabpull b{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  transform:translateX(-50%);width:52px;height:5px;border-radius:99px;background:var(--dim);opacity:.5}
.fabpull:active b{opacity:.9}
.fab{width:46px;height:46px;border-radius:50%;background:var(--sf);box-shadow:var(--sh);
  display:flex;align-items:center;justify-content:center;transition:background .4s,transform .15s;
  flex:0 0 auto}
.fab:active{transform:scale(.92)}
.fab svg{width:20px;height:20px}
.fab.main{width:72px;height:72px;background:var(--btn);color:var(--btnink);
  box-shadow:0 6px 22px rgba(0,0,0,.32)}
.fab.main svg{width:30px;height:30px}
.fab.act svg{color:#1E88E5}

.tip{position:fixed;left:50%;transform:translateX(-50%);z-index:38;
  bottom:calc(env(safe-area-inset-bottom,0px) + 104px);font-size:11.5px;color:var(--ink);
  background:var(--sf);box-shadow:var(--sh);padding:8px 14px;border-radius:999px;
  pointer-events:none;transition:opacity .4s;max-width:86vw;text-align:center}

/* ---------- シート ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);opacity:0;
  pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--sf);
  border-radius:20px 20px 0 0;box-shadow:var(--sh2);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  transform:translateY(100%);transition:transform .4s cubic-bezier(.18,.92,.24,1),background .4s;
  max-height:88%;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.grab{width:36px;height:4px;border-radius:99px;background:var(--line);margin:9px auto 0}
.head{display:flex;gap:12px;align-items:center;padding:16px 16px 0}
.head .av{width:52px;height:52px;border-radius:50%;flex:0 0 52px;background-size:cover;
  background-position:center;background-color:var(--chip);border:2px solid var(--ring);
  box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:var(--dim)}
.head .t{flex:1;min-width:0}
.head h2{font-size:18px;font-weight:700;line-height:1.35;margin-bottom:3px}
.head p{font-size:13px;color:var(--dim)}
.acts{display:flex;gap:8px;padding:14px 16px 0}
.acts button{flex:1;padding:11px;border-radius:10px;font-size:13.5px;font-weight:600;
  background:var(--chip)}
.acts .main{background:var(--btn);color:var(--btnink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:16px}
.grid i{display:block;width:100%;aspect-ratio:1;background-size:cover;background-position:center;
  background-color:var(--chip)}
.posts{padding:14px 16px 0}
.post{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.post:last-child{border-bottom:none}
.post .av2{width:30px;height:30px;border-radius:50%;flex:0 0 30px;background:var(--chip);
  background-size:cover;background-position:center}
.post .b{flex:1;min-width:0}
.post .b b{font-size:13px;font-weight:600}
.post .b span{font-size:12px;color:var(--dim);margin-left:6px}
.post .b p{font-size:13.5px;line-height:1.6;margin-top:3px}
.empty{padding:22px 16px;text-align:center;font-size:13px;color:var(--dim);line-height:1.8}

/* ---------- 入力 ---------- */
.fld{width:100%;background:var(--chip);border-radius:12px;padding:13px 14px;font-size:15px;
  margin-bottom:9px}
.fld::placeholder{color:var(--dim)}
.lab{font-size:12px;font-weight:600;color:var(--dim);margin:14px 0 7px}
.chips{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px;padding-bottom:3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--chip);color:var(--dim)}
.chip.on{background:var(--btn);color:var(--btnink)}
.photorow{display:flex;gap:9px;margin-bottom:12px}
.pick{flex:1;height:74px;border-radius:12px;background:var(--chip);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:5px;
  color:var(--dim);font-size:11px}
.pick svg{width:19px;height:19px}
.shot{width:100%;border-radius:12px;margin:0 0 10px;display:block}
.btn{width:100%;padding:15px;border-radius:12px;background:var(--btn);color:var(--btnink);
  font-size:15px;font-weight:700;margin-top:4px}
.btn:disabled{opacity:.35}
.btn.g{background:var(--chip);color:var(--ink);font-weight:600}
.btn.d{background:none;color:var(--warn);font-weight:600}
.pad{padding:0 16px}

/* ---------- 場所の確認 ---------- */
.zoombar{position:fixed;right:9px;top:50%;transform:translateY(-50%);
  width:5px;height:150px;border-radius:99px;background:rgba(128,128,128,.22);
  z-index:39;opacity:0;transition:opacity .2s;pointer-events:none;
  display:flex;align-items:flex-end;overflow:hidden}
.zoombar.on{opacity:1}
.zoombar b{display:block;width:100%;background:var(--ink);border-radius:99px;
  opacity:.75;transition:height .06s linear}

.focus{pointer-events:none}
.focus i{display:block;width:15px;height:15px;border-radius:50%;background:var(--btn);
  border:3px solid var(--ring);box-shadow:var(--sh)}
.focus u{position:absolute;left:50%;top:50%;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;
  border-radius:50%;border:2px solid var(--btn);animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.4);opacity:0}}

.drop{pointer-events:none}
/* 置こうとしている場所の印。地図を隠さないよう、輪郭だけにする */
.drop .im{width:16px;height:16px;border-radius:50%;background:transparent;
  border:2.5px solid var(--btn);box-shadow:none}
.drop .tl{display:none}
.drop::after{content:'';position:absolute;left:50%;top:50%;width:38px;height:38px;
  margin:-19px 0 0 -19px;border-radius:50%;border:1.5px solid var(--btn);opacity:.3}
.confirm{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  z-index:80;background:var(--sf);border-radius:18px;padding:16px;box-shadow:var(--sh2);
  display:none}
.confirm.on{display:block;animation:rise .3s cubic-bezier(.18,.92,.24,1)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.cf-name{font-size:16px;font-weight:700;line-height:1.4;word-break:break-all}
.cf-ask{font-size:12.5px;color:var(--dim);margin-top:5px;display:block}
.cf-btns{display:flex;gap:8px;margin-top:14px}
.cf-btns button{flex:1;padding:13px;border-radius:11px;font-size:14.5px;font-weight:600;
  background:var(--chip)}
.cf-btns .y{background:var(--btn);color:var(--btnink)}
.cf-cancel{width:100%;text-align:center;font-size:12px;color:var(--dim);margin-top:10px}
.confirm.pick .cf-btns{display:none}
body.placing .fabs,body.placing .tip,body.placing .top{display:none}

.maplibregl-ctrl-attrib{font-size:9px!important}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>

  <div class="sp-in">

      <path d="M36 22v56" stroke="currentColor" stroke-width="5"/>
      <path d="M58 34c6.6 0 12 5.4 12 12 0 8.2-12 20-12 20S46 54.2 46 46c0-6.6 5.4-12 12-12z" fill="currentColor"/>

</div>

<div id="map"></div>

<div class="top">
  <div class="q">

    <input id="q" placeholder="店名・地名で探す" autocomplete="off" enterkeyhint="search">

  </button>
</div>

<div class="fabs">
  <button class="fab" id="btn-loc" title="現在地">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><path d="M12 1.5v3.5M12 19v3.5M1.5 12H5M19 12h3.5"/></svg>
  </button>

  </button>
  <button class="fab main" id="btn-cam" title="撮る">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7.5h4L8.5 5.5h7L17 7.5h4v12H3z"/><circle cx="12" cy="13" r="3.6"/></svg>
  </button>
  <button class="fab" id="btn-lib" title="カメラロール">

  </button>
  <button class="fab" id="btn-me" title="アカウント">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>

</div>

<div class="tip" id="tip">地図をタップして、思い出を追加</div>

<div class="confirm" id="confirm">
  <span class="cf-name" id="cf-name">場所を調べています…</span>
  <span class="cf-ask" id="cf-ask">この場所でいいですか？</span>
  <div class="cf-btns"><button id="cf-no">いいえ</button><button class="y" id="cf-yes">はい</button></div>

</div>

<div class="scrim" id="scrim"></div>
<input type="file" accept="image/*" capture="environment" hidden id="in-cam">
<input type="file" accept="image/*" multiple hidden id="in-lib">

<script>
var BUILD='v53';
/* 地図が出そろったら起動画面を引く。念のため時間でも消す */
function hideSplash(){
  var s=document.getElementById('splash');
  if(!s||s.classList.contains('gone'))return;
  setTimeout(function(){ s.classList.add('gone');
    setTimeout(function(){ s.remove(); },700); },420);
}
setTimeout(function(){ hideSplash(); },6000);
function showErr(m){var e=document.getElementById('err');e.style.display='block';
  e.innerHTML='<b>エラー（そのまま貼ってください） BUILD='+BUILD+'</b>\n'+m;}
function dump(x){if(x===undefined)return'undefined';if(x===null)return'null';
  if(x.stack)return (x.message||'')+'\n--- 発生箇所 ---\n'+x.stack;return String(x);}
window.addEventListener('error',function(e){showErr('[error] '+(e.message||'')+'\n'+
  (e.filename||'')+':'+(e.lineno||'')+(e.error&&e.error.stack?'\n'+e.error.stack:''));});
window.addEventListener('unhandledrejection',function(e){showErr('[promise] '+dump(e.reason));});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script>
/* 1つ目が届かなかったときの控え。順に試す */
(function(){
  if(typeof QRCode!=='undefined')return;
  var list=[
    'https://unpkg.com/qrcode@1.5.4/build/qrcode.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'
  ];
  var i=0;
  (function next(){
    if(i>=list.length||typeof QRCode!=='undefined')return;
    var s=document.createElement('script');
    s.src=list[i++];
    s.onload=function(){ if(typeof QRCode==='undefined')next(); };
    s.onerror=next;
    document.head.appendChild(s);
  })();
})();
</script>

<script>
if(typeof maplibregl==='undefined'){ showErr('地図の読み込みに失敗しました'); }
else{ try{

/* アプリとして動くとき、/api は自分自身を指してしまう。
   そのため、サーバーの場所をはっきり書いておく */
const SERVER = (location.protocol==='http:'||location.protocol==='https:')
  ? '' : 'https://broad-wildflower-9e30.j4hrd7zdgc.workers.dev';

const STYLE='https://tiles.openfreemap.org/styles/liberty';
const CATS=['喫茶','食','酒','湯','宿','社','園','景','本'];
const ASK={'喫茶':['何を飲んだ / 食べた？','クリームソーダ'],'食':['何を食べた？','味玉らーめん'],
  '酒':['何を飲んだ？','レモンサワー'],'湯':['ひとこと','外気浴の椅子が最高'],
  '社':['どう撮った？','夕方、参道から'],'園':['どう撮った？','桜、朝いちばん'],
  '景':['どう撮った？','対岸から、日没20分前'],'本':['ひとこと','2階の奥がいい'],
  '宿':['どんな宿だった？','露天風呂つき／朝ごはんが良い']};
function ask(c){return ASK[c]||['ひとこと',''];}
const HP_CAT={G001:'酒',G002:'酒',G011:'酒',G012:'酒',G014:'喫茶'};

let spots=[], pois=[], placing=null, dropM=null, meM=null, askSeq=0;
let night=(function(){var h=new Date().getHours();return h<6||h>=18;})();
let is3D=true;
document.body.classList.toggle('dark',night);

function esc(s){return String(s==null?'':s).replace(/[<>&"]/g,function(c){
  return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});}
function setTip(t){var e=document.getElementById('tip');e.textContent=t;e.style.opacity='1';
  clearTimeout(setTip.t);setTip.t=setTimeout(function(){e.style.opacity='0';},4200);}
function valid(p){return p&&isFinite(p.lat)&&isFinite(p.lng)&&Math.abs(p.lat)<=90&&Math.abs(p.lng)<=180;}
function nid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function el(h){var d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;}

/* ---------- 端末内の保存 ---------- */
let db=null;
function openDB(){return new Promise(function(r){try{
  if(!window.indexedDB)return r(false);
  var q=indexedDB.open('michikusa',2);
  q.onupgradeneeded=function(){var d=q.result;
    if(!d.objectStoreNames.contains('spots'))d.createObjectStore('spots',{keyPath:'id'});
    if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'k'});
    if(!d.objectStoreNames.contains('seen'))d.createObjectStore('seen',{keyPath:'id'});};
  q.onsuccess=function(){db=q.result;r(true);};q.onerror=function(){r(false);};
  setTimeout(function(){if(!db)r(false);},4000);}catch(e){r(false);}});}
function tx(s,m){return db.transaction(s,m).objectStore(s);}
function dbPut(s,v){return new Promise(function(r){if(!db)return r(false);
  try{var q=tx(s,'readwrite').put(v);q.onsuccess=function(){r(true);};q.onerror=function(){r(false);};}catch(e){r(false);}});}
function dbDel(s,k){return new Promise(function(r){if(!db)return r(false);
  try{var q=tx(s,'readwrite').delete(k);q.onsuccess=function(){r(true);};q.onerror=function(){r(false);};}catch(e){r(false);}});}
function dbAll(s){return new Promise(function(r){if(!db)return r([]);
  try{var q=tx(s,'readonly').getAll();q.onsuccess=function(){r(q.result||[]);};q.onerror=function(){r([]);};}catch(e){r([]);}});}

/* ============================================================
   地図の配色

   これまでは元の色を計算でずらしていたが、
   夜に道路が背景へ沈んでしまう問題があった。
   Apple Maps は夜でも道路が背景より明るい。そこが読みやすさの要。

   そこで計算をやめ、地図の部品ごとに色を割り当てる方式にする。
   ============================================================ */
const PALETTE={
  night:{
    land:      '#2C3B3B',   // 陸。黒ではなく、緑がかった暗いグレー
    water:     '#1B3A6B',   // 水。しっかり青を残す
    green:     '#28402F',   // 公園・林
    road:      '#6E7C82',   // 大きな道。背景より明るくする
    roadMinor: '#4E5C62',   // 細い道
    roadCase:  '#22302F',   // 道のふち
    rail:      '#3F4C52',
    building:  '#33443F',
    text:      '#E8EDEA',
    textSub:   '#A8B6B2',
    halo:      '#1E2A29',
    border:    '#4A5A58'
  },
  day:{
    land:      '#F2F0EA',
    water:     '#A9CBE8',
    green:     '#D6E4CE',
    road:      '#FFFFFF',
    roadMinor: '#FFFFFF',
    roadCase:  '#E0DDD5',
    rail:      '#D8D4CB',
    building:  '#E6E2D9',
    text:      '#3A3A38',
    textSub:   '#7A7A76',
    halo:      '#FFFFFF',
    border:    '#D2CEC4'
  }
};

/* 地図の部品の名前から、どの役割かを見分ける */
function roleOf(L){
  var id=(L.id||'').toLowerCase();
  var sl=(L['source-layer']||'').toLowerCase();

  if(L.type==='background')                       return 'land';
  if(/water|ocean|sea|lake|river/.test(id+sl))    return 'water';
  if(/park|wood|forest|grass|green|golf|cemetery|pitch/.test(id+sl)) return 'green';
  if(/building/.test(id+sl))                      return 'building';
  if(/rail|transit|aeroway/.test(id+sl))          return 'rail';
  if(/boundary|admin/.test(id+sl))                return 'border';
  if(/tunnel|bridge|road|highway|street|path|transportation/.test(id+sl)){
    if(/case|outline|casing/.test(id))            return 'roadCase';
    if(/motorway|trunk|primary|secondary/.test(id)) return 'road';
    return 'roadMinor';
  }
  if(/landuse|landcover|earth|land/.test(id+sl))  return 'land';
  return null;
}

function retint(st){
  var C=PALETTE[night?'night':'day'];
  var s=JSON.parse(JSON.stringify(st));

  (s.layers||[]).forEach(function(L){
    if(!L.paint)L.paint={};

    if(L.type==='symbol'){
      // 文字は、地名の大きさで濃さを変える
      var big=/place|city|town|country|state/.test((L.id||'')+(L['source-layer']||''));
      L.paint['text-color']=big?C.text:C.textSub;
      L.paint['text-halo-color']=C.halo;
      L.paint['text-halo-width']=1.6;
      return;
    }

    var role=roleOf(L);
    if(!role)return;
    var col=C[role];

    if(L.type==='background') L.paint['background-color']=col;
    if(L.type==='fill'){
      L.paint['fill-color']=col;
      if('fill-outline-color' in L.paint) L.paint['fill-outline-color']=C.roadCase;
    }
    if(L.type==='line'){
      L.paint['line-color']=col;
      // 夜は道路をわずかに太くする。細いと背景に沈んで見えなくなる
      if(night && (role==='road'||role==='roadMinor') && L.paint['line-width']!==undefined){
        var w=L.paint['line-width'];
        if(typeof w==='number') L.paint['line-width']=w*1.25;
        else if(Array.isArray(w)) L.paint['line-width']=['*',w,1.25];
      }
      if(night && role==='road') L.paint['line-opacity']=1;
    }
    if(L.type==='fill-extrusion') L.paint['fill-extrusion-color']=C.building;
  });

  return s;
}

let SPRITE=null;
function scanSprite(){
  SPRITE={};
  try{
    // MapLibre が読み込み済みの絵の名前を全部もらう
    var names=(map.style&&map.style.imageManager&&map.style.imageManager.images)
      ? Object.keys(map.style.imageManager.images) : [];
    if(!names.length&&map.listImages) names=map.listImages();
    names.forEach(function(n){ SPRITE[n]=1; });
  }catch(e){}
  return SPRITE;
}
function findIcon(words){
  if(!SPRITE)scanSprite();
  var keys=Object.keys(SPRITE);
  for(var i=0;i<words.length;i++){
    var w=words[i];
    if(SPRITE[w])return w;
    // 部分一致（cafe_11 / cafe-15 などに対応）
    for(var k=0;k<keys.length;k++){
      if(keys[k].indexOf(w)===0)return keys[k];
    }
  }
  return '';
}
const ICON_CACHE={};
function pickIcon(cat){
  if(ICON_CACHE[cat]!==undefined)return ICON_CACHE[cat];
  var v=findIcon(ICON_ALT[cat]||ICON_ALT['景']);
  ICON_CACHE[cat]=v;
  return v;
}

/* ============================================================
   写真を地図そのものに描く

   HTMLの要素を重ねると、拡大縮小のあいだ地図と別々に動いてしまう。
   （地図はcanvasの中で描かれ、HTMLはその外側で追いかけるため）

   そこで写真を丸く切り抜いた画像を作り、地図に登録して使う。
   地図の記号と同じ扱いになるので、ずれようがない。
   ============================================================ */
const PHOTO_ZOOM=16.2;         // これ以上寄ったら写真にする
const madeIcons={};            // 作った画像の名前
const makingIcons={};          // 作っている途中のもの

let photoDiag={try:0,ok:0,ngLoad:0,ngAdd:0,last:''};

/** 写真を丸く切り抜いて、地図に登録する */
function makeRoundIcon(url,mine,key){
  if(madeIcons[key]||makingIcons[key])return;
  makingIcons[key]=1;
  photoDiag.try++;

  var im=new Image();
  var src=url;
  if(!/^data:/.test(url)){
    // よその画像は自分のサーバーを通す。そうしないとCanvasで加工できない
    src=SERVER+'/api/img?u='+encodeURIComponent(url);
    im.crossOrigin='anonymous';
  }

  im.onload=function(){
    try{
      var S=128,R=S/2,ring=7;
      var cv=document.createElement('canvas');
      cv.width=S; cv.height=S;
      var x=cv.getContext('2d',{willReadFrequently:true});

      x.beginPath(); x.arc(R,R,R-1,0,Math.PI*2);
      x.fillStyle = mine ? (night?'#FAFAFA':'#111111') : (night?'#101010':'#FFFFFF');
      x.fill();

      x.save();
      x.beginPath(); x.arc(R,R,R-ring,0,Math.PI*2); x.clip();
      var s=Math.min(im.width,im.height);
      x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,ring,ring,S-ring*2,S-ring*2);
      x.restore();

      var dat=x.getImageData(0,0,S,S);
      if(map.hasImage(key))map.removeImage(key);
      // ImageData をそのまま渡すのが一番確実
      map.addImage(key,dat,{pixelRatio:2});

      madeIcons[key]=1;
      delete makingIcons[key];
      photoDiag.ok++;
      refreshPhotoSource();
    }catch(e){
      delete makingIcons[key];
      photoDiag.ngAdd++;
      photoDiag.last=String(e&&e.message||e);
    }
  };
  im.onerror=function(){
    delete makingIcons[key];
    photoDiag.ngLoad++;
    photoDiag.last='画像を読めない: '+String(url).slice(0,60);
  };
  im.src=src;
}

function photoKey(p,mine){
  // 名前と座標から、重ならない名前をつくる
  return 'ph_'+(mine?'m':'o')+'_'+
    String(p.n||'').replace(/[^A-Za-z0-9]/g,'').slice(0,12)+'_'+
    p.lat.toFixed(5)+'_'+p.lng.toFixed(5);
}

function photoFeatures(){
  var out=[];
  if(map.getZoom()<PHOTO_ZOOM)return out;
  var b=map.getBounds(), c=map.getCenter(), list=[];

  // 地図に写真で出るのは、自分が撮ったものだけ。
  // 店の宣材写真を並べると「グルメアプリ」になってしまう。
  // ここはアルバムなので、写っているのは自分の記録だけでいい。
  spots.filter(valid).forEach(function(s){
    if(b.contains([s.lng,s.lat])&&s.photo)list.push({p:s,mine:true,img:s.photo});
  });
  Object.keys(others).forEach(function(k){
    var o=others[k];
    if(valid(o)&&b.contains([o.lng,o.lat])&&o.photo)list.push({p:o,mine:false,img:o.photo});
  });

  list.sort(function(a,x){
    if(a.mine!==x.mine)return a.mine?-1:1;
    return Math.hypot(a.p.lat-c.lat,a.p.lng-c.lng)-Math.hypot(x.p.lat-c.lat,x.p.lng-c.lng);
  });
  list=list.slice(0,30);

  list.forEach(function(o){
    var key=photoKey(o.p,o.mine);
    if(!madeIcons[key]){ makeRoundIcon(o.img,o.mine,key); return; }
    out.push({type:'Feature',geometry:{type:'Point',coordinates:[o.p.lng,o.p.lat]},
      properties:{n:o.p.n,mine:o.mine?1:0,icon:key}});
  });
  return out;
}
function refreshPhotoSource(){
  if(map.getSource('photo'))
    map.getSource('photo').setData({type:'FeatureCollection',features:photoFeatures()});
}

const cf=document.getElementById('confirm');
const cfName=document.getElementById('cf-name'), cfAsk=document.getElementById('cf-ask');

function startPlacing(lat,lng,opt){
 try{
  opt=opt||{};
  if(!isFinite(lat)||!isFinite(lng))return;
  if(dropM){dropM.remove();dropM=null;}
  placing=Object.assign({lat:lat,lng:lng,place:null},opt);
  var d=document.createElement('div');d.className='pn drop';
  d.innerHTML='<div class="im"></div><div class="tl"></div>';
  dropM=new maplibregl.Marker({element:d,draggable:true,anchor:'bottom'})
    .setLngLat([lng,lat]).addTo(map);
  dropM.on('dragend',function(){var q=dropM.getLngLat();movePlacing(q.lat,q.lng,true);});
  closeSheet();                       // 開いている詳細を閉じる（重なり防止）
  document.body.classList.add('placing');
  cf.classList.add('on');cf.classList.remove('pick');
  map.easeTo({center:[lng,lat],zoom:Math.max(map.getZoom(),16.4),duration:480});
  askPlace(lat,lng);
 }catch(e){showErr('[startPlacing] '+dump(e));}
}
function movePlacing(lat,lng,drag){
  if(!placing)return;
  placing.lat=lat;placing.lng=lng;
  if(!drag&&dropM)dropM.setLngLat([lng,lat]);
  cf.classList.remove('pick');askPlace(lat,lng);
}
async function askPlace(lat,lng){
 try{
  var my=++askSeq;
  cfName.textContent='場所を調べています…';cfAsk.textContent='この場所でいいですか？';
  var r=await revGeo(lat,lng);

  placing.place=r.name;
  if(r.near&&!placing.known)placing.known=r.near.n;
  cfName.textContent=r.name;
  var ex=[placing.gname,placing.budget].filter(Boolean).join(' ・ ');
  cfAsk.textContent=ex||(r.near?('近く：'+r.near.n):'この場所でいいですか？');
 }catch(e){showErr('[askPlace] '+dump(e));}
}
function endPlacing(){

  placing=null;cf.classList.remove('on','pick');

document.getElementById('cf-yes').onclick=function(){

function baseCat(p){
  var c=((p.class||'')+'/'+(p.subclass||'')).toLowerCase();
  if(/cafe|coffee|tea/.test(c))return '喫茶';
  if(/bar|pub|alcohol|nightclub/.test(c))return '酒';
  if(/restaurant|fast_food|food|noodle/.test(c))return '食';
  if(/park|garden|playground/.test(c))return '園';
  if(/worship|shinto|temple|shrine/.test(c))return '社';
  if(/book|library/.test(c))return '本';
  if(/onsen|spa|bath|sauna/.test(c))return '湯';
  return '景';
}
map.on('click',function(e){
  if(placing){ movePlacing(e.lngLat.lat,e.lngLat.lng); return; }

  var pad=20,box=[[e.point.x-pad,e.point.y-pad],[e.point.x+pad,e.point.y+pad]],fs=[];
  try{ fs=map.queryRenderedFeatures(box); }catch(_){}

  /* 優先順位をはっきり決める。
     ① 自分の思い出　② フレンド　③ 読み込んだ場所　④ 地図に元からある店
     上のものが見つかったら、そこで打ち止め。
     こうしないと、記録を押したのに「この場所でいいですか」も一緒に出てしまう */
  function nearest(list){
    var best=null,bd=1e9;
    fs.forEach(function(f){
      if(!f.layer||list.indexOf(f.layer.id)<0)return;
      if(!f.geometry||f.geometry.type!=='Point')return;
      var q=map.project(f.geometry.coordinates);
      var d=Math.hypot(q.x-e.point.x,q.y-e.point.y);
      if(d<bd){bd=d;best=f;}
    });
    return best;
  }

  var f=nearest(['photo-ic','mine-ring','mine-ic']);
  if(f){
    var s=spots.filter(function(x){return x.n===f.properties.n;})[0];
    if(s){ openPlace(s,true); return; }
  }

  f=nearest(['frnd-ring','frnd-ic']);
  if(f){
    var ks=Object.keys(others);
    for(var i=0;i<ks.length;i++){
      if(others[ks[i]].n===f.properties.n){ openPlace(others[ks[i]],false); return; }
    }
  }

  f=nearest(['spot-dot','spot-ic']);
  if(f){
    var p3=pois.filter(function(x){return x.n===f.properties.n;})[0];
    if(p3){ openPlace(p3,false); return; }
  }

  var best=null,bd=1e9;
  fs.forEach(function(x){
    if(!x.geometry||x.geometry.type!=='Point')return;
    if(x.sourceLayer!=='poi'||!x.properties||!x.properties.name)return;
    var q=map.project(x.geometry.coordinates);
    var d=Math.hypot(q.x-e.point.x,q.y-e.point.y);
    if(d<bd){bd=d;best=x;}
  });
  if(best){
    var pr=best.properties,c=best.geometry.coordinates;
    var nm=pr['name:ja']||pr.name;
    var known=pois.filter(function(x){return x.n===nm;})[0];
    openPlace(known||{n:nm,c:baseCat(pr),lat:c[1],lng:c[0],
      gname:pr.subclass||pr.class||''},false);
    return;
  }

  startPlacing(e.lngLat.lat,e.lngLat.lng,{});
});

/* ---------- 地名を調べる ---------- */
const gcache=new Map();
async function revGeo(lat,lng){
  var key=lat.toFixed(4)+','+lng.toFixed(4);
  if(gcache.has(key))return gcache.get(key);
  var near=null,nd=1e9;
  pois.concat(spots).forEach(function(p){if(!valid(p))return;
    var d=Math.hypot((p.lat-lat)*111000,(p.lng-lng)*91000);
    if(d<nd){nd=d;near=p;}});
  if(nd>90)near=null;
  var name=null;
  try{
    var r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18'+
      '&accept-language=ja&lat='+lat+'&lon='+lng);
    if(r.ok){var j=await r.json(),a=j.address||{};
      var seq=[a.province||a.state,a.city||a.town||a.village||a.county,
        a.city_district||a.suburb,a.neighbourhood||a.quarter,a.road],o=[];
      seq.forEach(function(v){if(v&&o.indexOf(v)<0)o.push(v);});
      if(o.length)name=o.join('');
      if(j.name&&name&&name.indexOf(j.name)<0)name=j.name+'（'+name+'）';
      else if(j.name&&!name)name=j.name;}
  }catch(e){}
  if(!name&&near)name=near.n+' のあたり';
  if(!name)name=lat.toFixed(5)+', '+lng.toFixed(5);
  var out={name:name,near:near};gcache.set(key,out);return out;
}

const TAGS=[['amenity','public_bath','湯'],['shop','bakery','喫茶'],['shop','books','本'],
  ['leisure','park','園'],['amenity','place_of_worship','社'],
  ['tourism','attraction','景'],['tourism','viewpoint','景'],['tourism','museum','景']];
const OVER=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
let busy=false;
const cells={};
let loadLog={run:0,hp:0,wiki:0,rk:0,err:''};

/* この辺りのデータを取りに行く。
   同じところを何度も叩かないよう、約1km四方の区画で覚えておく */
async function autoLoad(force){
  try{
    if(busy||placing)return;
    if(map.getZoom()<14.5)return;
    var c=map.getCenter(), cell=c.lat.toFixed(2)+','+c.lng.toFixed(2);
    if(!force&&cells[cell])return;
    cells[cell]=1; busy=true; loadLog.run++;

    var n=await loadHP();
    var w=await loadWiki();
    var rk=await loadRakuten();
    loadLog.hp+=n; loadLog.wiki+=w; loadLog.rk+=rk;

    var t=n+w+rk;
    if(t){ render(true); setTip('この辺りを '+t+' 件 読み込みました'); }
    else if(force){ setTip('この辺りには見つかりませんでした'); }
  }catch(e){ loadLog.err=String(e&&e.message||e); }
  finally{ busy=false; }
}

function dedupe(){var s={};pois.forEach(function(p){s[p.n+p.lat.toFixed(4)]=1;});return s;}

async function loadHP(){
  var c=map.getCenter(),b=map.getBounds();
  var half=Math.abs(b.getNorth()-c.lat)*111000;
  var range=half<=300?1:half<=500?2:half<=1000?3:half<=2000?4:5;
  var r=await fetch(SERVER+'/api/hotpepper?lat='+c.lat+'&lng='+c.lng+'&range='+range+'&pages=3');
  var j=await r.json(); if(j.error){setTip(j.error);return 0;}
  var seen=dedupe(),n=0;
  (j.shops||[]).forEach(function(s){
    if(!isFinite(s.lat)||!isFinite(s.lng))return;
    var k=s.n+s.lat.toFixed(4); if(seen[k])return; seen[k]=1;
    pois.push({n:s.n,c:HP_CAT[s.genre]||'食',lat:s.lat,lng:s.lng,gname:s.gname,
      budget:s.budget,photo:s.photo||'',src:'hp'});n++;});
  return n;
}
const WSKIP=/学校|高校|中学|小学|大学|病院|株式会社|放送局|変電|工場/;
function wikiCat(s){s=String(s||'');
  if(/寺|神社|大社|神宮|教会/.test(s))return '社';
  if(/公園|庭園/.test(s))return '園';
  if(/温泉|銭湯/.test(s))return '湯';
  return '景';}
async function loadWiki(){
  try{
    var c=map.getCenter(),b=map.getBounds();
    var rad=Math.min(10000,Math.max(500,Math.round(Math.abs(b.getNorth()-c.lat)*111000)));
    var u='https://ja.wikipedia.org/w/api.php?action=query&format=json&origin=*'+
      '&generator=geosearch&ggscoord='+c.lat.toFixed(6)+'%7C'+c.lng.toFixed(6)+
      '&ggsradius='+rad+'&ggslimit=60&prop=coordinates%7Cdescription%7Cpageimages'+
      '&piprop=thumbnail&pithumbsize=240';
    var r=await fetch(u); if(!r.ok)return 0;
    var j=await r.json(),pg=(j.query&&j.query.pages)||{},seen=dedupe(),n=0;
    Object.keys(pg).forEach(function(k){
      var p=pg[k],co=p.coordinates&&p.coordinates[0]; if(!co||!p.title)return;
      var ds=p.description||''; if(WSKIP.test(p.title+ds))return;
      var key=p.title+Number(co.lat).toFixed(4); if(seen[key])return; seen[key]=1;
      pois.push({n:p.title,c:wikiCat(p.title+ds),lat:Number(co.lat),lng:Number(co.lon),
        gname:ds,photo:p.thumbnail?p.thumbnail.source:'',src:'wiki'});n++;});
    return n;
  }catch(e){return 0;}
}


/* 楽天トラベルの宿 */
async function loadRakuten(){
  try{
    var c=map.getCenter(),b=map.getBounds();
    var km=Math.min(3,Math.max(0.3,Math.abs(b.getNorth()-c.lat)*111));
    var r=await fetch(SERVER+'/api/rakuten?lat='+c.lat+'&lng='+c.lng+'&km='+km.toFixed(1));
    var j=await r.json(); if(j.error)return 0;
    var seen=dedupe(),n=0;
    (j.hotels||[]).forEach(function(x){
      if(!isFinite(x.lat)||!isFinite(x.lng))return;
      var k=x.n+x.lat.toFixed(4); if(seen[k])return; seen[k]=1;
      pois.push({n:x.n,c:'宿',lat:x.lat,lng:x.lng,
        gname:x.min?('1泊 '+Number(x.min).toLocaleString()+'円〜'):'宿',
        photo:x.photo||'',addr:x.addr||'',src:'rk'});n++;});
    return n;
  }catch(e){return 0;}
}

async function search(v){
  if(!v)return;
  var out=[];
  spots.filter(function(s){return s.n.indexOf(v)>=0;}).slice(0,3).forEach(function(s){
    out.push({k:'記録',img:s.photo,n:s.n,sub:s.place||'',lat:s.lat,lng:s.lng,p:s,mine:true});});
  pois.filter(function(p){return p.n.indexOf(v)>=0;}).slice(0,4).forEach(function(p){
    out.push({k:'地図',img:p.photo,n:p.n,sub:p.gname||'',lat:p.lat,lng:p.lng,p:p});});
  draw(out,'探しています…');
  var c=map.getCenter();
  try{
    var r=await fetch(SERVER+'/api/hotpepper?keyword='+encodeURIComponent(v)+
      '&lat='+c.lat+'&lng='+c.lng+'&range=5&pages=1');
    var j=await r.json();
    (j.shops||[]).slice(0,6).forEach(function(s){
      out.push({k:'店',img:s.photo,n:s.n,sub:[s.gname,s.addr].filter(Boolean).join(' ・ '),
        lat:s.lat,lng:s.lng,p:{n:s.n,c:HP_CAT[s.genre]||'食',lat:s.lat,lng:s.lng,
        gname:s.gname,budget:s.budget,photo:s.photo||'',src:'hp'}});});
  }catch(e){}
  try{
    var r2=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5'+
      '&accept-language=ja&countrycodes=jp&q='+encodeURIComponent(v));
    var j2=await r2.json();
    (j2||[]).forEach(function(p){
      out.push({k:'地名',n:p.name||String(p.display_name).split(',')[0],
        sub:p.display_name,lat:Number(p.lat),lng:Number(p.lon)});});
  }catch(e){}
  draw(out,null);
}
function draw(list,note){
  if(!list.length&&!note){resEl.innerHTML='<div class="reshead">見つかりませんでした</div>';
    resEl.classList.add('on');return;}
  var h=note?'<div class="reshead">'+note+'</div>':'';
  list.forEach(function(r,i){
    h+='<div class="res" data-i="'+i+'"><span class="ic"'+
      (r.img?' style="background-image:url('+JSON.stringify(r.img).replace(/"/g,'&quot;')+')"':'')+
      '>'+(r.img?'':esc((r.n||'?').charAt(0)))+'</span>'+
      '<span class="tx"><b>'+esc(r.n)+'</b><span>'+esc(r.sub||'')+'</span></span></div>';
  });
  resEl.innerHTML=h; resEl.classList.add('on');
  Array.prototype.forEach.call(resEl.querySelectorAll('.res'),function(e2){
    e2.onclick=function(){
      var r=list[Number(e2.dataset.i)];
      resEl.classList.remove('on'); qEl.blur();
      map.easeTo({center:[r.lng,r.lat],zoom:17,duration:750});
      if(r.p&&!r.mine&&r.p.src&&!pois.some(function(p){
        return p.n===r.p.n&&Math.abs(p.lat-r.p.lat)<1e-5;})){pois.push(r.p);}
      setTimeout(function(){ if(r.p)openPlace(r.p,!!r.mine);
        else startPlacing(r.lat,r.lng,{}); render(); },800);
    };
  });
}



/* ============================================================
   アプリとして動いているときは、iOSの仕組みを使う

   HTMLの入力欄はアプリの中だと制限がある。
   Capacitorの部品があればそちらを使い、
   無ければ（ブラウザなら）今まで通りの方法にする。
   ============================================================ */
const isApp = !!(window.Capacitor && window.Capacitor.isNativePlatform &&
                 window.Capacitor.isNativePlatform());

function plugin(name){
  return (window.Capacitor && window.Capacitor.Plugins &&
          window.Capacitor.Plugins[name]) || null;
}

/** 写真を1枚。撮るか、選ぶか */
async function pickPhoto(fromCamera){
  var Camera=plugin('Camera');
  if(!isApp||!Camera){
    document.getElementById(fromCamera?'in-cam':'in-lib').click();
    return null;
  }
  try{
    var r=await Camera.getPhoto({
      quality:100,
      allowEditing:false,
      resultType:'dataUrl',
      source:fromCamera?'CAMERA':'PHOTOS',
      saveToGallery:false
    });
    return r&&r.dataUrl?r.dataUrl:null;
  }catch(e){ return null; }   // 途中でやめた場合もここに来る
}

/** まとめて選ぶ */
async function pickPhotos(){
  var Camera=plugin('Camera');
  if(!isApp||!Camera||!Camera.pickImages){
    document.getElementById('in-bulk').click();
    return null;
  }
  try{
    var r=await Camera.pickImages({quality:100,limit:0});
    return (r&&r.photos)||[];
  }catch(e){ return null; }
}

/** 現在地。アプリなら許可を先に尋ねる */
async function whereAmI(){
  var Geo=plugin('Geolocation');
  if(isApp&&Geo){
    try{
      var st=await Geo.checkPermissions();
      if(st.location!=='granted'){
        st=await Geo.requestPermissions();
      }
      if(st.location!=='granted') return null;
      var p=await Geo.getCurrentPosition({enableHighAccuracy:true,timeout:15000});
      return {lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
    }catch(e){ return null; }
  }
  return new Promise(function(res){
    if(!navigator.geolocation)return res(null);
    navigator.geolocation.getCurrentPosition(function(p){
      res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy});
    },function(){ res(null); },
      {enableHighAccuracy:true,timeout:15000,maximumAge:60000});
  });
}

   ・許可されていなければ、ここで初めて尋ねる

let locDone=false;

    'border:2.5px solid #fff;box-shadow:0 0 0 6px rgba(30,136,229,.22),0 2px 8px rgba(0,0,0,.35)';
  meM=new maplibregl.Marker({element:d}).setLngLat([lng,lat]).addTo(map);
}
async function goHome(quiet){
  var p=await whereAmI();
  if(!p){
    if(!quiet) setTip('現在地を使えません。設定から許可してください');

  map.easeTo({center:[p.lng,p.lat],zoom:p.acc>2000?14:16.4,duration:900});

async function afterPhoto(dataUrl,file){

      var g=await exifr.gps(target).catch(function(){return null;});

    var here=await whereAmI();
    if(here)gps={lat:here.lat,lng:here.lng};
  }
  var c=map.getCenter();
  startPlacing(gps?gps.lat:c.lat, gps?gps.lng:c.lng, {photo:dataUrl,date:date});
  if(!gps)setTimeout(function(){
    cfAsk.textContent='写真に位置情報がありません。場所を選んでください';},900);
}

/* ============================================================
   一度取り込んだ写真を覚えておく

   写真そのものに固有の番号は無いので、指紋を自分で作る。
   撮影日時＋座標で判別し、日時が無いものはファイルの中身から作る。
   ============================================================ */
function fingerprint(lat,lng,at,file){
  if(at&&isFinite(lat)){
    return 'g'+Math.round(at/1000)+'_'+lat.toFixed(5)+'_'+lng.toFixed(5);
  }
  // 日時が取れない場合は、大きさと更新時刻で代用
  return 'f'+(file?file.size:0)+'_'+(file?(file.lastModified||0):0);
}
async function seenAdd(fp){ return dbPut('seen',{id:fp,at:Date.now()}); }
async function seenHas(fp){
  return new Promise(function(r){
    if(!db)return r(false);
    try{
      var q=db.transaction('seen','readonly').objectStore('seen').get(fp);
      q.onsuccess=function(){ r(!!q.result); };
      q.onerror=function(){ r(false); };
    }catch(e){ r(false); }
  });
}

/* ============================================================
   カメラロールからまとめて取り込む

   写真には撮った場所と日時が埋まっている。
   それを読めば、選ぶだけで地図が埋まる。
   1枚ずつ記録させると続かないので、ここが要になる。
   ============================================================ */
function readAsData(file){
  return new Promise(function(res){
    var r=new FileReader();
    r.onload=function(){res(r.result);};
    r.onerror=function(){res(null);};
    r.readAsDataURL(file);
  });
}

async function handleBulk(files){
  if(!files.length)return;
  if(typeof exifr==='undefined'){ setTip('写真を読む部品がありません'); return; }

  var s=showSheet('<div class="grab"></div><div class="pad" style="padding-top:18px">'+
    '<div style="font-size:18px;font-weight:700;margin-bottom:6px">写真を読んでいます</div>'+
    '<div id="bmsg" style="font-size:13px;color:var(--dim);line-height:1.9">'+
      files.length+' 枚を調べています…</div>'+
    '<div id="blist" style="margin-top:14px"></div>'+
    '<div id="bfoot"></div></div>');
  var msg=s.querySelector('#bmsg'), foot=s.querySelector('#bfoot');

  var found=[], noGeo=0, already=0;
  for(var i=0;i<files.length;i++){
    msg.textContent=(i+1)+' / '+files.length+' 枚を調べています…';
    var f=files[i];
    try{
      var g=await exifr.gps(f).catch(function(){return null;});
      if(!g||g.latitude==null){ noGeo++; continue; }
      var pp=await exifr.parse(f,{pick:['DateTimeOriginal','CreateDate']}).catch(function(){return null;});
      var dt=pp&&(pp.DateTimeOriginal||pp.CreateDate);
      var at=dt?new Date(dt).getTime():(f.lastModified||Date.now());
      var fp=fingerprint(g.latitude,g.longitude,dt?at:null,f);
      if(await seenHas(fp)){ already++; continue; }   // もう入れたもの
      found.push({file:f,lat:g.latitude,lng:g.longitude,fp:fp,
        d:dt?new Date(dt).toISOString().slice(0,10):'', at:at});
    }catch(err){ noGeo++; }
  }

  if(!found.length){
    if(already&&!noGeo){
      msg.innerHTML='<b>'+already+' 枚</b>は、すでに地図に入っています。<br>'+
        '<span style="font-size:12px">新しく入れるものはありませんでした。</span>';
      foot.innerHTML='<button class="btn g" id="x" style="margin-top:16px">とじる</button>';
      foot.querySelector('#x').onclick=closeSheet;
      return;
    }
    msg.innerHTML='位置情報のある写真が見つかりませんでした。<br>'+
      '<span style="font-size:12px">iPhoneなら「設定 → プライバシーとセキュリティ → '+
      '位置情報サービス → カメラ」をオンにしてください。</span>';
    foot.innerHTML='<button class="btn g" id="x" style="margin-top:16px">とじる</button>';
    foot.querySelector('#x').onclick=closeSheet;
    return;
  }

  // 近くて時間も近いものを、ひとつの場所にまとめる
  found.sort(function(a,b){return a.at-b.at;});
  var groups=[];
  found.forEach(function(p){
    var g=groups[groups.length-1];
    if(g){
      var d=Math.hypot((p.lat-g.lat)*111000,(p.lng-g.lng)*91000);
      var dt=Math.abs(p.at-g.at)/3600000;
      if(d<120&&dt<3){ g.items.push(p); return; }
    }
    groups.push({lat:p.lat,lng:p.lng,at:p.at,d:p.d,items:[p]});
  });

  msg.innerHTML='<b>'+found.length+' 枚</b>から <b>'+groups.length+' か所</b>が見つかりました。'+
    (noGeo?('<br><span style="font-size:12px">位置情報のない '+noGeo+' 枚は除きました。</span>'):'')+
    (already?('<br><span style="font-size:12px">すでに入っている '+already+' 枚は飛ばしました。</span>'):'');

  var list=s.querySelector('#blist');
  list.innerHTML='<div style="font-size:12px;color:var(--dim)">場所を調べています…</div>';
  for(var k=0;k<groups.length;k++){
    var r=await revGeo(groups[k].lat,groups[k].lng);
    groups[k].place=r.name;
    groups[k].name=(r.near&&r.near.n)||r.name;
    groups[k].cat=(r.near&&r.near.c)||'景';
  }

  list.innerHTML=groups.map(function(g,i){
    return '<div class="post" style="align-items:center">'+
      '<div class="av2" id="bth'+i+'"></div>'+
      '<div class="b"><b>'+esc(g.name)+'</b>'+
      '<span>'+esc(g.d||'')+' ・ '+g.items.length+'枚</span></div>'+
      '<button class="chip on" data-skip="'+i+'" style="flex:0 0 auto">入れる</button></div>';
  }).join('');

  groups.forEach(function(g,i){
    var r2=new FileReader();
    r2.onload=function(){
      var e2=document.getElementById('bth'+i);
      if(e2)e2.style.backgroundImage='url('+JSON.stringify(r2.result)+')';
    };
    r2.readAsDataURL(g.items[0].file);
  });

  var skip={};
  Array.prototype.forEach.call(list.querySelectorAll('[data-skip]'),function(b){
    b.onclick=function(){
      var i=b.dataset.skip;
      skip[i]=!skip[i];
      b.classList.toggle('on',!skip[i]);
      b.textContent=skip[i]?'入れない':'入れる';
    };
  });

  foot.innerHTML='<button class="btn" id="go" style="margin-top:16px">'+
      'この '+groups.length+' か所を地図に置く</button>'+
    '<button class="btn g" id="x" style="margin-top:8px">やめる</button>';
  foot.querySelector('#x').onclick=closeSheet;

  foot.querySelector('#go').onclick=async function(){
    var btn=this; btn.disabled=true;
    var use=groups.filter(function(g,i){return !skip[i];});
    var done=0;
    for(var i=0;i<use.length;i++){
      var g=use[i];
      btn.textContent=(i+1)+' / '+use.length+' を置いています…';
      var url=await readAsData(g.items[0].file);
      var rec={id:nid(),n:g.name,c:g.cat,lat:g.lat,lng:g.lng,place:g.place||'',
        tag:'',d:g.d||new Date(g.at).toISOString().slice(0,10),photo:url||''};
      spots.push(rec);
      await dbPut('spots',rec);
      for(var q=0;q<g.items.length;q++){ if(g.items[q].fp) await seenAdd(g.items[q].fp); }
      if(fbUser) pushOne(rec);
      done++;
    }
    closeSheet(); render(true);
    setTip(done+' か所を地図に置きました');
    if(use.length) map.easeTo({center:[use[0].lng,use[0].lat],zoom:16.6,duration:900});
  };
}

/* 写真をサーバーへ。原本と表示用を別々に持つ */
async function uploadPhoto(postId, dataUrl){
  try{
    var blob=await (await fetch(dataUrl)).blob();
    var pid=nid();
    // 原本
    await api('/api/photo?post_id='+postId+'&photo_id='+pid+'&kind=orig',
      {method:'PUT',headers:{'Content-Type':blob.type||'image/jpeg'},body:blob});
    // 表示用（軽くしたもの）
    var view=await resize(dataUrl,1600,.86);
    if(view){
      var vb=await (await fetch(view)).blob();
      await api('/api/photo?post_id='+postId+'&photo_id='+pid+'&kind=view',
        {method:'PUT',headers:{'Content-Type':'image/jpeg'},body:vb});
    }
    var th=await resize(dataUrl,400,.8);
    if(th){
      var tb=await (await fetch(th)).blob();
      await api('/api/photo?post_id='+postId+'&photo_id='+pid+'&kind=thumb',
        {method:'PUT',headers:{'Content-Type':'image/jpeg'},body:tb});
    }
    return pid;
  }catch(e){ return null; }
}
function resize(dataUrl,max,q){
  return new Promise(function(res){
    var im=new Image();
    im.onload=function(){
      var sc=Math.min(1,max/Math.max(im.width,im.height));
      var cv=document.createElement('canvas');
      cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
      var cx=cv.getContext('2d'); cx.imageSmoothingQuality='high';
      cx.drawImage(im,0,0,cv.width,cv.height);
      res(cv.toDataURL('image/jpeg',q));
    };
    im.onerror=function(){res(null);};
    im.src=dataUrl;
  });
}

/* 1件をサーバーへ送る */
async function pushOne(rec){
  try{
    var r=await api('/api/posts',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        title:rec.n, category:rec.c, tag:rec.tag||'', place_name:rec.place||'',
        lat:rec.lat, lng:rec.lng,
        taken_at:rec.d?Date.parse(rec.d):null,
        visibility:rec.visibility||null
      })});
    if(!r.ok)return false;
    var j=await r.json();
    rec.server_id=j.id;
    rec.visibility=j.visibility;
    if(rec.photo) await uploadPhoto(j.id, rec.photo);
    rec.synced=1;
    await dbPut('spots',rec);
    return true;
  }catch(e){ return false; }
}

let fetching=false;
async function syncDown(){
  if(!fbUser||fetching)return;
  fetching=true;
  try{
    var b=map.getBounds();
    var r=await api('/api/posts?s='+b.getSouth()+'&w='+b.getWest()+
      '&n='+b.getNorth()+'&e='+b.getEast()+'&limit=300');
    if(!r.ok)return;
    var j=await r.json();
    var mineIds={}; spots.forEach(function(s){ if(s.server_id)mineIds[s.server_id]=1; });
    var added=0;
    (j.posts||[]).forEach(function(p){
      if(p.mine){
        if(mineIds[p.id])return;                 // すでに手元にある
        var rec={id:nid(),server_id:p.id,synced:1,n:p.title,c:p.category,
          tag:p.tag||'',place:p.place_name||'',lat:p.lat,lng:p.lng,
          d:p.taken_at?new Date(p.taken_at).toISOString().slice(0,10):'',
          photo:'',visibility:p.visibility};
        spots.push(rec); dbPut('spots',rec); added++;
      }else{
        // 他人の思い出。地図には出すが端末には残さない
        var k=p.id;
        if(others[k])return;
        others[k]={n:p.title,c:p.category,lat:p.lat,lng:p.lng,
          gname:(p.author&&p.author.name?p.author.name+' の思い出':''),
          tag:p.tag||'',author:p.author,precision:p.precision,friend:true};
        added++;
      }
    });
    if(added)render(true);
  }catch(e){}finally{ fetching=false; }
}

  var inp=s.querySelector('#h-in'), msg=s.querySelector('#h-msg'), ok=s.querySelector('#h-ok');

  function check(){
    var v=inp.value.trim();
    if(!/^[A-Za-z0-9_]{3,20}$/.test(v)){
      msg.textContent='英数字と _ で、3〜20文字にしてください';
      msg.style.color='var(--dim)';
      ok.disabled=true; return false;
    }
    msg.textContent='@'+v+' でよければ、下のボタンを押してください';
    msg.style.color='var(--dim)';
    ok.disabled=false; return true;
  }
  inp.oninput=check; check();

  ok.onclick=async function(){
    if(!check())return;
    var v=inp.value.trim();
    ok.disabled=true; ok.textContent='確かめています…';
    try{
      var r=await api('/api/me',{method:'PATCH',
        headers:{'Content-Type':'application/json'},body:JSON.stringify({handle:v})});
      var j=await r.json().catch(function(){return {};});
      if(r.status===409){
        msg.textContent=(j.code==='taken')
          ? 'そのIDは既に使われています。別のものを入れてください'
          : (j.error||'そのIDは使えません');
        msg.style.color='var(--warn)';
        ok.disabled=false; ok.textContent='このIDにする';
        inp.focus(); inp.select();
        return;
      }
      if(!r.ok){
        msg.textContent=j.error||'保存できませんでした';
        msg.style.color='var(--warn)';
        ok.disabled=false; ok.textContent='このIDにする';
        return;
      }
      meP.handle=v;
      askingHandle=false;
      closeSheet();
      setTip('@'+v+' に決まりました');
    }catch(e){
      msg.textContent='通信できませんでした';
      msg.style.color='var(--warn)';
      ok.disabled=false; ok.textContent='このIDにする';
    }
  };
  setTimeout(function(){inp.focus();},380);
}

function doLogin(){
  if(typeof firebase==='undefined'){ setTip('ログインの部品がありません'); return; }
  var pv=new firebase.auth.GoogleAuthProvider();
  pv.setCustomParameters({prompt:'select_account'});

  // アプリの中では、画面を移さずにその場で済ませる
  var FA=plugin('FirebaseAuthentication');
  if(isApp&&FA){
    setTip('ログインしています…');
    FA.signInWithGoogle().then(function(r){
      // 受け取った証をこちら側にも渡す
      var tok=r&&r.credential&&r.credential.idToken;
      var acc=r&&r.credential&&r.credential.accessToken;
      if(!tok&&!acc){ setTip('ログインできませんでした'); return; }
      var cred=firebase.auth.GoogleAuthProvider.credential(tok||null,acc||null);
      return firebase.auth().signInWithCredential(cred);
    }).then(function(){
      setTip('ログインしました');
    }).catch(function(e){
      var c=(e&&(e.code||e.message))||e;
      if(/cancel/i.test(String(c)))return;      // 自分でやめた場合
      setTip('ログイン失敗: '+c);
    });
    return;
  }

  if(isApp){
    // 部品が無い場合は、画面遷移で
    firebase.auth().signInWithRedirect(pv).catch(function(e){
      setTip('ログイン失敗: '+(e&&e.code||e));
    });
    return;
  }

  firebase.auth().signInWithPopup(pv).catch(function(e){
    if(e&&/popup|blocked|cancel/i.test(e.code||'')){
      firebase.auth().signInWithRedirect(pv);
    }else{
      setTip('ログイン失敗: '+(e&&e.code||e));
    }
  });
}

/** ログアウト。アプリのときは両方から出る */
function doLogout(){
  var FA=plugin('FirebaseAuthentication');
  if(isApp&&FA){ try{ FA.signOut(); }catch(e){} }
  try{ firebase.auth().signOut(); }catch(e){}
  setTip('ログアウトしました');
}

/* ============================================================
   QRコード

   目の前にいる相手なら、IDを打つより早い。
   作るのも読むのも自前でやる（外の部品に頼らない）。
   ============================================================ */

/* --- 作る側 ---
   規格どおりのQRには誤り訂正が要る。自前で書くと読めないものができるので、
   実績のある部品に任せる。届かない場合は、外の画像づくりに頼る。 */
function qrInto(el2,text,px){
  el2.innerHTML='<div style="font-size:12px;color:var(--dim)">QRを作っています…</div>';

  function byLib(){
    try{
      if(typeof QRCode==='undefined')return false;
      var cv=document.createElement('canvas');
      // 版によって呼び方が違うので、両方試す
      if(QRCode.toCanvas){
        el2.innerHTML=''; el2.appendChild(cv);
        QRCode.toCanvas(cv,text,{width:px,margin:2,errorCorrectionLevel:'M',
          color:{dark:'#000000',light:'#FFFFFF'}},function(err){
          if(err){ byImage(); return; }
          cv.style.borderRadius='10px'; cv.style.display='block';
        });
        return true;
      }
      if(QRCode.toDataURL){
        QRCode.toDataURL(text,{width:px,margin:2},function(err,url){
          if(err){ byImage(); return; }
          el2.innerHTML='<img src="'+url+'" width="'+px+'" height="'+px+
            '" style="border-radius:10px;display:block">';
        });
        return true;
      }
      return false;
    }catch(e){ return false; }
  }

  // 部品が無いときは、画像として作ってもらう
  function byImage(){
    var u='https://api.qrserver.com/v1/create-qr-code/?size='+px+'x'+px+
      '&margin=8&data='+encodeURIComponent(text);
    var im=new Image();
    im.width=px; im.height=px;
    im.style.cssText='border-radius:10px;display:block;background:#fff';
    im.onload=function(){ el2.innerHTML=''; el2.appendChild(im); };
    im.onerror=function(){
      el2.innerHTML='<div style="font-size:12px;color:var(--dim);line-height:1.8">'+
        'QRを作れませんでした。<br>下のIDを直接入れてもらってください。</div>';
    };
    im.src=u;
  }

  if(!byLib()) byImage();
}

/* ============================================================
   指の動きで隠す・出す
   ・下のカード：下へ払うと畳む。上へ払うと戻る
   ・右のボタン：素早く上へ払うと隠れる。下へ払うと戻る
   ============================================================ */
(function(){
  var fabs=document.querySelector('.fabs');
  var pull=document.getElementById('fabpull');

  function setFabs(hide){
    fabs.classList.toggle('hide',hide);
    pull.classList.toggle('on',hide);
  }
  var fy=0,ft=0,fmoved=false;
  function onStart(e){ fy=e.touches[0].clientY; ft=Date.now(); fmoved=false; }
  function onMove(e){ if(Math.abs(e.touches[0].clientY-fy)>8)fmoved=true; }
  function onEnd(e){
    var dy=e.changedTouches[0].clientY-fy, dt=Date.now()-ft;
    if(!fmoved){ if(fabs.classList.contains('hide')) setFabs(false); return; }
    var fast=dt<420;
    if(dy> 30&&fast) setFabs(true);    // 下へ払うと隠す
    if(dy<-30&&fast) setFabs(false);   // 上へ払うと戻す
  }
  [fabs,pull].forEach(function(el2){
    el2.addEventListener('touchstart',onStart,{passive:true});
    el2.addEventListener('touchmove',onMove,{passive:true});
    el2.addEventListener('touchend',onEnd,{passive:true});
  });
  pull.addEventListener('click',function(){ setFabs(false); });
  pull.addEventListener('mousedown',function(){ setFabs(false); });
})();


/* ============================================================
   片手ズーム

   画面の右端を上下になぞると、拡大・縮小できる。
   両手が使えないときのため。
   ・上へ → 寄る
   ・下へ → 引く
   縦に動いたときだけ効かせて、地図を動かす操作と喧嘩しないようにする。
   ============================================================ */
(function(){
  var el2=document.getElementById('map');
  var W=44;                 // 右端からこの幅の中で始めたときだけ
  var on=false, y0=0, z0=0, moved=0;
  var hint=null;

  function edge(x){ return x > window.innerWidth - W; }

  function showBar(v){
    if(!hint){
      hint=document.createElement('div');
      hint.className='zoombar';
      hint.innerHTML='<b></b>';
      document.body.appendChild(hint);
    }
    hint.classList.toggle('on',v);
  }
  function setBar(z){
    if(!hint)return;
    var t=(z-map.getMinZoom())/(map.getMaxZoom()-map.getMinZoom());
    hint.querySelector('b').style.height=Math.max(4,t*100)+'%';
  }

  el2.addEventListener('touchstart',function(e){
    if(e.touches.length!==1)return;
    if(!edge(e.touches[0].clientX))return;
    on=true; moved=0;
    y0=e.touches[0].clientY;
    z0=map.getZoom();
    showBar(true); setBar(z0);
  },{passive:true});

  el2.addEventListener('touchmove',function(e){
    if(!on||e.touches.length!==1)return;
    var dy=y0-e.touches[0].clientY;         // 上へ動かすと正
    moved=Math.max(moved,Math.abs(dy));
    if(moved<6)return;
    e.preventDefault();                      // 地図の移動を止める
    // 画面の高さいっぱいで、およそ6段階ぶん
    var z=z0 + (dy/window.innerHeight)*6;
    z=Math.min(map.getMaxZoom(),Math.max(map.getMinZoom(),z));
    map.setZoom(z);
    setBar(z);
  },{passive:false});

  function end(){
    if(!on)return;
    on=false;
    showBar(false);
  }
  el2.addEventListener('touchend',end,{passive:true});
  el2.addEventListener('touchcancel',end,{passive:true});
})();

        (photoDiag.last?('<br><span style="color:var(--warn)">直近のエラー：'+

        '<br>地図の絵の総数 '+all.length+
      '</div>'+
      '<div style="font-size:12.5px;line-height:2;margin-bottom:14px">'+picks+'</div>'+
      '<button class="btn g" id="x">とじる</button></div>');
    s.querySelector('#x').onclick=closeSheet;
  }catch(e){ showErr('[diag] '+dump(e)); }
}
if(location.search.indexOf('diag=1')>=0) setTimeout(showDiag,1500);

(function(){
  var n=0,t=0;
  document.addEventListener('click',function(e){
    if(e.clientY>150||e.clientX>130){n=0;return;}
    var now=Date.now();
    if(now-t>900)n=0;
    t=now; n++;
    if(n>=3){n=0;showDiag();}
  },true);
})();

/* ---------- 起動 ---------- */
(async function(){
 try{
  var ok=await openDB();
  if(ok) spots=(await dbAll('spots')).filter(valid);
  if(map.isStyleLoaded())render();
 }catch(e){showErr('[init] '+dump(e));}
})();

}catch(e){ showErr(e.message+'\n'+(e.stack||'')); } }
</script>
