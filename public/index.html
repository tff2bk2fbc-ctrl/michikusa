<div id="err"></div>
<div id="splash">
  <div class="sp-in">
    <img src="/icon-192.png?v=123" class="sp-mark" id="sp-icon" alt="">
    <div class="sp-nm">Spota</div>
    <div class="sp-sb">地図に、思い出を。</div>
  </div>
</div>

<section class="onboarding" id="onboarding" hidden aria-labelledby="onboarding-title">
  <main class="onboarding-panel" id="onboarding-panel" tabindex="-1">
    <div class="onboarding-progress" aria-hidden="true"><i id="onboarding-progress"></i></div>
    <div class="onboarding-content" id="onboarding-content"></div>
  </main>
</section>

<dialog class="onboarding-legal" id="onboarding-legal" aria-labelledby="onboarding-legal-title">
  <header>
    <h1 id="onboarding-legal-title">文書を読み込んでいます</h1>
    <button type="button" id="onboarding-legal-close" aria-label="文書を閉じる">閉じる</button>
  </header>
  <div class="onboarding-legal-body" id="onboarding-legal-body"></div>
</dialog>

<div id="map"></div>

<section class="map-trend-strip" id="map-trend-strip" aria-label="急上昇ワード" hidden>
  <span class="map-trend-caption">急上昇</span>
  <div class="map-trend-list" id="map-trend-list"></div>
</section>

<div class="top">
  <div class="q">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
    <input id="q" placeholder="店名・地名で探す" autocomplete="off" enterkeyhint="search">
    <button class="x" id="qx">✕</button>
  </div>
  <div class="top-actions" aria-label="地図と新着">
    <button class="top-action" id="btn-map-scope" type="button" aria-label="みんなの地図へ切り替える" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.7"/><path d="M4.8 20c.6-3.4 3.2-5.5 7.2-5.5s6.6 2.1 7.2 5.5"/></svg>
    </button>
    <button class="top-action" id="btn-notifications" type="button" aria-label="通知">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 10.5a5.5 5.5 0 0 1 11 0c0 5 2 5.6 2 5.6h-15s2-.6 2-5.6"/><path d="M9.6 19a2.7 2.7 0 0 0 4.8 0"/></svg>
      <span class="top-badge" id="notification-badge" hidden></span>
    </button>
    <button class="top-action" id="btn-messages" type="button" aria-label="メッセージ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h16v11H9l-5 3z"/><path d="M8 10h8M8 13h5"/></svg>
      <span class="top-badge" id="message-badge" hidden></span>
    </button>
  </div>
</div>
<div class="results" id="results"></div>

<button class="map-locate" id="map-locate" type="button" aria-label="現在地を読み込む">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>

<div class="fabpull" id="fabpull"><b></b></div>

<nav class="fabs" id="fabs" aria-label="主要な操作">
  <div class="sheen"></div>

  <div class="nav-items">
    <div class="pill" id="pill"></div>

    <button class="nav-btn" id="btn-timeline" data-i="0" aria-label="タイムライン">
      <div class="bc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3.2 2"/></svg>
        <span class="sr-only">タイムライン</span>
      </div>
    </button>

    <button class="nav-btn" id="btn-bulk" data-i="1" aria-label="思い出アルバム">
      <div class="bc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h6l1.6 2H20v11H4z"/><path d="M7 15l3-2.6 2.5 2 2.1-1.7L18 15.5"/><circle cx="9" cy="10.5" r="1"/></svg>
        <span class="sr-only">思い出</span>
      </div>
    </button>

    <button class="cam" id="btn-cam" aria-label="カメラ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5h4L8.5 5.5h7L17 7.5h4v12H3z"/><circle cx="12" cy="13" r="3.6"/></svg>
    </button>

    <button class="nav-btn" id="btn-lib" data-i="2" aria-label="写真">
      <div class="bc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5h18v13H3z"/><path d="M3 15l5-4 4 3 3-3 6 5"/><circle cx="8.5" cy="9" r="1.3"/></svg>
        <span class="sr-only">写真</span>
      </div>
    </button>

    <button class="nav-btn" id="btn-me" data-i="3" aria-label="プロフィール">
      <div class="bc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <span class="sr-only">プロフィール</span>
      </div>
    </button>
  </div>

</nav>

<div class="tip" id="tip">地図をタップして、思い出を追加</div>

<div class="confirm" id="confirm">
  <span class="cf-name" id="cf-name">場所を調べています…</span>
  <span class="cf-ask" id="cf-ask">この場所でいいですか？</span>
  <div class="cf-btns"><button id="cf-no">いいえ</button><button class="y" id="cf-yes">はい</button></div>
  <button class="cf-cancel" id="cf-cancel">やめる</button>
</div>

<div class="scrim" id="scrim"></div>
<div class="spota-wait" id="spota-wait" hidden aria-hidden="true">
  <div class="spota-flash-loader" aria-hidden="true">
    <svg viewBox="0 0 96 96"><circle class="charge" cx="48" cy="48" r="43"/></svg>
    <span class="bulb"><i></i></span>
  </div>
</div>
<p class="sr-only" id="spota-wait-status" role="status" aria-atomic="true"></p>
<input type="file" accept="image/*" capture="environment" hidden id="in-cam">
<input type="file" accept="image/*" hidden id="in-lib">
<input type="file" accept="image/*" multiple hidden id="in-bulk">
