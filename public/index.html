
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>みちくさ — v16</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
:root{
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,monospace;
  --hi:#FFC24B; --mizu:#3E9B9B; --shu:#E2574C;
}
/* 夜 */
body.night{
  --bg:#0B111C; --panel:rgba(16,26,43,.97); --ink:#EDE7DA; --dim:#8E9AAC;
  --line:rgba(237,231,218,.13); --field:rgba(0,0,0,.28); --lblink:#F2EEE6; --lblout:#0B111C;
}
/* 昼 */
body.day{
  --bg:#EFEAE0; --panel:rgba(255,253,249,.97); --ink:#2A2622; --dim:#7C766D;
  --line:rgba(42,38,34,.14); --field:rgba(42,38,34,.05); --lblink:#2A2622; --lblout:#FFFDF7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
button,input{font-family:inherit;color:inherit;border:none;background:none}
button{cursor:pointer}
#map{position:fixed;inset:0}

#err{position:fixed;top:0;left:0;right:0;z-index:9999;background:#7A2118;color:#FFE8E4;
  font-family:var(--mono);font-size:11px;line-height:1.6;padding:12px 14px;display:none;
  white-space:pre-wrap;max-height:45%;overflow:auto}
#err b{color:var(--hi)}

/* ---- 上部：検索 ---- */
.top{position:fixed;top:0;left:0;right:0;z-index:600;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 8px;
  display:flex;gap:8px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:9px;background:var(--panel);
  border:1px solid var(--line);border-radius:99px;padding:11px 15px;
  box-shadow:0 6px 24px rgba(0,0,0,.28);backdrop-filter:blur(12px)}
.search svg{width:17px;height:17px;color:var(--dim);flex:0 0 17px}
.search input{flex:1;font-size:15px;outline:none;background:none;min-width:0}
.search input::placeholder{color:var(--dim)}
.search .x{color:var(--dim);font-size:17px;padding:0 2px;display:none}
.badge{background:var(--panel);border:1px solid var(--line);border-radius:99px;
  padding:9px 12px;font-family:var(--mono);font-size:10px;color:var(--dim);
  box-shadow:0 6px 24px rgba(0,0,0,.28);white-space:nowrap;line-height:1.5;text-align:right}
.badge b{color:var(--hi);font-size:14px}

.results{position:fixed;left:12px;right:12px;z-index:601;
  top:calc(env(safe-area-inset-top,0px) + 62px);
  background:var(--panel);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 14px 44px rgba(0,0,0,.4);overflow:hidden;display:none;
  max-height:60vh;overflow-y:auto;backdrop-filter:blur(12px)}
.results.on{display:block}
.res{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;
  border-bottom:1px solid var(--line);cursor:pointer}
.res:last-child{border-bottom:none}
.res .ic{flex:0 0 30px;height:30px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:13px;background:var(--field);color:var(--hi)}
.res .tx{flex:1;min-width:0}
.res .tx b{display:block;font-size:14.5px;font-weight:600;margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .tx span{font-size:11.5px;color:var(--dim);display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .kind{font-family:var(--mono);font-size:8.5px;color:var(--dim);flex:0 0 auto;padding-top:3px}
.reshead{padding:10px 15px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  color:var(--dim);background:var(--field)}

/* ---- 地図上のラベル ---- */
.lbl,.lbl2{font-family:var(--sans);white-space:nowrap;pointer-events:none;
  text-shadow:0 0 4px var(--lblout),0 0 9px var(--lblout),0 0 13px var(--lblout)}
.lbl{font-size:11.5px;font-weight:600;color:var(--lblink);transform:translateY(11px)}
.lbl2{font-size:10.5px;font-weight:500;color:var(--mizu);transform:translateY(10px);opacity:.95}

/* ---- ボタン ---- */
.fabs{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:700;
  display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.fab{width:54px;height:54px;border-radius:50%;background:var(--hi);color:#0B111C;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 26px rgba(255,194,75,.4)}
.fab svg{width:24px;height:24px}
.fab.sub{width:44px;height:44px;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.fab.sub svg{width:19px;height:19px}
.fab.sub.act{color:var(--mizu)}

.load{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:700;
  background:var(--panel);border:1px solid var(--line);color:var(--mizu);
  border-radius:99px;padding:11px 16px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.35);
  display:flex;align-items:center;gap:7px}
.load:disabled{opacity:.5}
.load svg{width:15px;height:15px;flex:0 0 15px}

.tip{position:fixed;left:50%;transform:translateX(-50%);z-index:600;
  bottom:calc(env(safe-area-inset-bottom,0px) + 86px);
  font-family:var(--mono);font-size:10px;color:var(--dim);background:var(--panel);
  border:1px solid var(--line);padding:7px 13px;border-radius:99px;
  pointer-events:none;transition:opacity .4s;max-width:88vw;text-align:center}

/* ---- 置く場所の確認 ---- */
.drop i{display:block;width:22px;height:22px;border-radius:50% 50% 50% 0;background:var(--hi);
  transform:rotate(-45deg);box-shadow:0 0 22px rgba(255,194,75,.9);position:relative}
.drop i::after{content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;
  margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#0B111C}
.confirm{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  z-index:900;background:var(--panel);border:1px solid rgba(255,194,75,.4);border-radius:22px;
  padding:16px 17px 15px;box-shadow:0 14px 46px rgba(0,0,0,.5);display:none;backdrop-filter:blur(12px)}
.confirm.on{display:block;animation:rise .25s cubic-bezier(.2,.85,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.cf-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:13px}
.cf-ico{flex:0 0 20px;margin-top:2px;color:var(--hi)}
.cf-ico svg{width:20px;height:20px}
.cf-name{font-size:16.5px;font-weight:600;line-height:1.45;word-break:break-all}
.cf-ask{font-size:11.5px;color:var(--dim);margin-top:5px;display:block}
.cf-btns{display:flex;gap:9px}
.cf-btns button{flex:1;padding:14px;border-radius:14px;font-size:15px;font-weight:600}
.cf-no{border:1px solid var(--line);color:var(--dim)}
.cf-yes{background:var(--hi);color:#0B111C}
.cf-cancel{width:100%;text-align:center;font-size:11px;color:var(--dim);margin-top:11px}
.confirm.pick .cf-btns{display:none}
body.placing .fabs,body.placing .load,body.placing .tip,body.placing .top{display:none}

/* ---- シート ---- */
.scrim{position:fixed;inset:0;z-index:2000;background:rgba(5,8,14,.6)}
.card{position:fixed;left:0;right:0;bottom:0;z-index:2001;background:var(--panel);
  border-top:1px solid var(--line);border-radius:26px 26px 0 0;
  padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px);max-height:92%;overflow-y:auto;
  animation:up .28s cubic-bezier(.2,.85,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:34px;height:3px;border-radius:2px;background:var(--line);margin:-6px auto 15px}
.here{display:flex;gap:10px;align-items:flex-start;border:1px solid rgba(255,194,75,.3);
  border-radius:15px;padding:13px 14px;margin-bottom:14px;background:rgba(255,194,75,.06)}
.here svg{width:17px;height:17px;color:var(--hi);flex:0 0 17px;margin-top:2px}
.here b{font-size:14.5px;font-weight:600;line-height:1.5}
.here em{font-style:normal;display:block;font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:5px}
.chips{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;padding-bottom:3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 15px;border:1px solid var(--line);border-radius:99px;
  font-size:13px;font-weight:500;color:var(--dim);background:var(--field)}
.chip.on{border-color:var(--hi);background:rgba(255,194,75,.15);color:var(--hi)}
.fld{width:100%;background:var(--field);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;font-size:15px;margin-bottom:9px;outline:none}
.fld::placeholder{color:var(--dim)}
.fld:focus{border-color:rgba(255,194,75,.5)}
.lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--hi);margin:14px 0 7px}
.photorow{display:flex;gap:10px;margin-bottom:14px}
.pick{flex:1;height:76px;border:1px dashed var(--line);border-radius:14px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--dim);font-size:10.5px}
.pick svg{width:19px;height:19px;opacity:.6}
.shot{width:100%;border-radius:14px;margin:0 0 8px;display:block}
.btn{width:100%;padding:16px;border-radius:15px;background:var(--hi);color:#0B111C;
  font-size:15.5px;font-weight:700;margin-top:4px}
.btn:disabled{opacity:.35}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--dim);font-weight:400;
  font-size:13px;padding:12px;margin-top:8px}
.det h3{font-size:20px;font-weight:600;margin:4px 0 6px}
.det .sub{font-size:12px;color:var(--dim);margin:0 0 12px}
.det .dish{border:1px solid rgba(255,194,75,.35);border-radius:14px;padding:12px 14px;margin-bottom:13px}
.det .dish em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  color:var(--hi);display:block;margin-bottom:5px}
.det .dish b{font-size:17px;font-weight:600}
.det img.ph{width:100%;border-radius:14px;margin-bottom:13px;display:block}

.me{flex:0 0 42px;height:42px;border-radius:50%;background:var(--panel);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 24px rgba(0,0,0,.28);overflow:hidden}
.me svg{width:19px;height:19px;color:var(--dim)}
.me.on{border-color:var(--hi)}
.me b{font-size:15px;font-weight:600;color:var(--hi)}

.gbtn{width:100%;padding:15px;border-radius:15px;background:#fff;color:#1f1f1f;
  font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;
  margin-top:6px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.gbtn svg{width:19px;height:19px}
.au-name{font-size:19px;font-weight:600;margin:2px 0 4px}
.au-sub{font-size:12px;color:var(--dim);margin-bottom:18px;word-break:break-all}
.au-note{font-size:11.5px;line-height:1.85;color:var(--dim);
  border-left:2px solid var(--line);padding-left:12px;margin:16px 0}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 0;border-bottom:1px solid var(--line)}
.setrow:last-of-type{border-bottom:none}
.setrow .l{font-size:13.5px}
.setrow .l em{font-style:normal;display:block;font-size:11px;color:var(--dim);margin-top:3px}
.seg{display:flex;gap:5px;flex:0 0 auto}
.seg button{padding:7px 11px;border-radius:9px;border:1px solid var(--line);
  font-size:11.5px;color:var(--dim)}
.seg button.on{border-color:var(--hi);background:rgba(255,194,75,.15);color:var(--hi)}
.maplibregl-ctrl-attrib{font-size:9px!important;background:var(--panel)!important}
.maplibregl-ctrl-attrib a{color:var(--dim)!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
var BUILD='v16';
function showErr(m){var e=document.getElementById('err');e.style.display='block';
  e.innerHTML='<b>エラー（そのまま貼ってください） BUILD='+BUILD+'</b>\n'+m;}
function dump(x){
  if(x===undefined)return 'undefined'; if(x===null)return 'null';
  if(x.stack)return (x.message||'')+'\n--- 発生箇所 ---\n'+x.stack;
  return String(x);
}
window.addEventListener('error',function(e){
  showErr('[error] '+(e.message||'')+'\n'+(e.filename||'')+':'+(e.lineno||'')+
    (e.error&&e.error.stack?'\n--- 発生箇所 ---\n'+e.error.stack:''));});
window.addEventListener('unhandledrejection',function(e){showErr('[promise] '+dump(e.reason));});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
/* ============================================================
   みちくさ v14
   ・地図   : MapLibre GL JS + OpenFreeMap（無料・キー不要）
   ・3D     : 建物を fill-extrusion で立ち上げる
   ・昼夜   : 同じ地図の配色を計算で反転させて2色に
   ・検索   : 読み込み済み → ホットペッパー → 地名 の順に探す
   ============================================================ */
if(typeof maplibregl==='undefined'){ showErr('MapLibre を読み込めませんでした'); }
else{ try{

const STYLE_URL='https://tiles.openfreemap.org/styles/liberty';
const CATS=['喫茶','食','酒','湯','社','園','景','本'];
const ASK={
  '喫茶':['何を飲んだ / 食べた？','例：クリームソーダ'],
  '食'  :['何を食べた？','例：味玉らーめん'],
  '麺'  :['何を食べた？','例：味玉らーめん'],
  '酒'  :['何を飲んだ？','例：レモンサワー'],
  '湯'  :['ひとこと','例：外気浴の椅子が最高'],
  '社'  :['どう撮った？','例：夕方、参道から'],
  '園'  :['どう撮った？','例：桜、朝いちばん'],
  '景'  :['どう撮った？','例：対岸から、日没20分前'],
  '本'  :['ひとこと','例：2階の奥がいい']
};
function ask(c){return ASK[c]||['ひとこと',''];}
const HP_CAT={G001:'酒',G002:'酒',G011:'酒',G012:'酒',G014:'喫茶'};

const SEED=[
  {id:'s1',n:'カヤバ珈琲',c:'喫茶',lat:35.7229,lng:139.7669,tag:'たまごサンド',d:'2026-05-10',place:'東京都台東区谷中'},
  {id:'s2',n:'浅草寺',c:'社',lat:35.7148,lng:139.7967,tag:'夜、雷門の裏から',d:'2026-03-15',place:'東京都台東区浅草'}
];
let spots=[], pois=[], placing=null, labels=[], meMarker=null, is3D=true;
let night = (function(){var h=new Date().getHours(); return h<6||h>=18;})();

function esc(s){return String(s==null?'':s).replace(/[<>&"]/g,function(c){
  return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});}
function setTip(t){var e=document.getElementById('tip');e.textContent=t;e.style.opacity='1';}
function valid(p){return p&&isFinite(p.lat)&&isFinite(p.lng)&&Math.abs(p.lat)<=90&&Math.abs(p.lng)<=180;}
function newId(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ---------- 保存（端末内） ---------- */
let db=null;
function openDB(){return new Promise(function(res){
  try{
    if(!window.indexedDB) return res(false);
    var rq=indexedDB.open('michikusa',1);
    rq.onupgradeneeded=function(){var d=rq.result;
      if(!d.objectStoreNames.contains('spots'))d.createObjectStore('spots',{keyPath:'id'});
      if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'k'});};
    rq.onsuccess=function(){db=rq.result;res(true);};
    rq.onerror=function(){res(false);};
    setTimeout(function(){if(!db)res(false);},4000);
  }catch(e){res(false);}
});}
function tx(s,m){return db.transaction(s,m).objectStore(s);}
function dbPut(s,v){return new Promise(function(r){if(!db)return r(false);
  try{var q=tx(s,'readwrite').put(v);q.onsuccess=function(){r(true);};q.onerror=function(){r(false);};}catch(e){r(false);}});}
function dbDel(s,k){return new Promise(function(r){if(!db)return r(false);
  try{var q=tx(s,'readwrite').delete(k);q.onsuccess=function(){r(true);};q.onerror=function(){r(false);};}catch(e){r(false);}});}

  try{var q=tx(s,'readonly').getAll();q.onsuccess=function(){r(q.result||[]);};q.onerror=function(){r([]);};}catch(e){r([]);}});}

/* ============================================================
   配色：昼の地図を計算で反転させて夜にする
   （夜用の地図データを別に持たなくて済む）
   ============================================================ */
function parseColor(c){
  if(typeof c!=='string')return null;
  var s=c.trim();
  var m=s.match(/^#([0-9a-f]{3,8})$/i);
  if(m){
    var x=m[1];
    if(x.length===3)x=x[0]+x[0]+x[1]+x[1]+x[2]+x[2];
    if(x.length===6)x+='ff';
    if(x.length!==8)return null;
    return [parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),
            parseInt(x.slice(4,6),16),parseInt(x.slice(6,8),16)/255];
  }
  m=s.match(/^rgba?\(([^)]+)\)$/i);
  if(m){
    var p=m[1].split(',').map(function(v){return parseFloat(v);});
    if(p.length<3)return null;
    return [p[0],p[1],p[2],p.length>3?p[3]:1];
  }
  return null;
}
function toHsl(r,g,b){
  r/=255;g/=255;b/=255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2,d=mx-mn;
  if(d){ s=l>.5?d/(2-mx-mn):d/(mx+mn);
    h = mx===r ? ((g-b)/d+(g<b?6:0)) : mx===g ? ((b-r)/d+2) : ((r-g)/d+4);
    h*=60; }
  return [h,s,l];
}
/** 色を夜向けに変換する。用途によって扱いを変える */
function nightColor(c,kind){
  var rgb=parseColor(c); if(!rgb)return c;
  var hsl=toHsl(rgb[0],rgb[1],rgb[2]), h=hsl[0], s=hsl[1], l=hsl[2], a=rgb[3];
  var L,S;
  if(kind==='text'){          // 文字は明るく
    L=0.94-l*0.35; S=Math.min(s,.25);
  }else if(kind==='halo'){    // 文字のふちは暗く
    L=0.05; S=Math.min(s,.3);
  }else{                      // 地面・水・建物・道は暗く
    L=0.05+(1-l)*0.26; S=s*0.55;
  }
  return 'hsla('+h.toFixed(0)+','+(S*100).toFixed(0)+'%,'+(L*100).toFixed(0)+'%,'+a+')';
}
function walkColor(v,kind){
  if(typeof v==='string')return nightColor(v,kind);
  if(Array.isArray(v))return v.map(function(x){return walkColor(x,kind);});
  return v;
}
function toNight(style){
  var s=JSON.parse(JSON.stringify(style));
  (s.layers||[]).forEach(function(L){
    if(!L.paint)return;
    Object.keys(L.paint).forEach(function(k){
      if(!/color/i.test(k))return;
      var kind = k==='text-color'||k==='icon-color' ? 'text'
               : /halo/.test(k) ? 'halo' : 'fill';
      L.paint[k]=walkColor(L.paint[k],kind);
    });
  });
  return s;
}

let dayStyle=null;

map.on('load',function(){
  dayStyle=map.getStyle();
  document.body.className = night?'night':'day';
  if(night) applyNight(true); else buildLayers();
});

function applyNight(first){
  if(!dayStyle)return;
  map.setStyle(night?toNight(dayStyle):dayStyle,{diff:false});
  map.once('idle',function(){ buildLayers(); });
}

/** 自前のレイヤーを積む。地図のスタイルを差し替えるたびに呼ぶ */
function buildLayers(){
 try{
  if(!map.getSource('spots')){
    map.addSource('spots',{type:'geojson',data:fc([])});
    map.addSource('pois', {type:'geojson',data:fc([])});
  }
  /* 3Dの建物 */
  if(!map.getLayer('bld3d')){
    var src=null, st=map.getStyle();
    for(var k in st.sources){ if(st.sources[k].type==='vector'){src=k;break;} }
    if(src){
      // 最初の文字レイヤーを探し、その「下」に建物を入れる。
      // 上に置くと、地名や店名が建物の裏に隠れて読めなくなる
      var firstSymbol=null;
      for(var i=0;i<st.layers.length;i++){
        if(st.layers[i].type==='symbol'){ firstSymbol=st.layers[i].id; break; }
      }
      map.addLayer({
        id:'bld3d', type:'fill-extrusion', source:src, 'source-layer':'building',
        minzoom:14,
        paint:{
          'fill-extrusion-color': night?'#1E2A3E':'#DCD4C4',
          'fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],6],
          'fill-extrusion-base':['coalesce',['get','render_min_height'],0],
          'fill-extrusion-opacity':night?0.82:0.9
        }
      }, firstSymbol);
      map.setLayoutProperty('bld3d','visibility',is3D?'visible':'none');
    }
  }
  if(!map.getLayer('glow')){
    map.addLayer({id:'glow',type:'circle',source:'spots',paint:{
      'circle-radius':['interpolate',['linear'],['zoom'],11,10,15,34,18,72],
      'circle-color':'#FFC24B','circle-blur':1,'circle-opacity':0.28}});
    map.addLayer({id:'pin',type:'circle',source:'spots',paint:{
      'circle-radius':['interpolate',['linear'],['zoom'],11,4.5,15,8,18,12],
      'circle-color':'#0B111C','circle-stroke-color':'#FFC24B','circle-stroke-width':2}});
    map.addLayer({id:'poi',type:'circle',source:'pois',paint:{
      'circle-radius':['interpolate',['linear'],['zoom'],13,2.6,16,5,18,7],
      'circle-color':'#0B111C','circle-stroke-color':'#3E9B9B','circle-stroke-width':1.4}});
  }
  refresh();
 }catch(e){ showErr('[buildLayers] '+dump(e)); }
}

function fc(list){
  return {type:'FeatureCollection',features:list.filter(valid).map(function(s){
    return {type:'Feature',geometry:{type:'Point',coordinates:[s.lng,s.lat]},
      properties:{id:s.id||'',n:s.n,c:s.c||'',gname:s.gname||'',budget:s.budget||''}};
  })};
}
function refresh(){
  if(map.getSource('spots'))map.getSource('spots').setData(fc(spots));
  if(map.getSource('pois')) map.getSource('pois').setData(fc(pois));
  document.getElementById('readout').innerHTML='<b>'+spots.length+'</b> 灯<br>'+pois.length+' 件';
  drawLabels();
}

/* 名前はHTMLで描く（日本語のフォント問題を避けるため） */
function drawLabels(){
 try{
  labels.forEach(function(m){m.remove();}); labels=[];
  var z=map.getZoom(); if(z<13)return;
  var b=map.getBounds(), placed=[];
  function room(lat,lng,text){
    var q=map.project([lng,lat]);
    var w=Math.max(34,String(text).length*6.2);
    for(var i=0;i<placed.length;i++){
      var r=placed[i];
      if(Math.abs(q.x-r.x)<(w+r.w)/2 && Math.abs(q.y-r.y)<15)return false;
    }
    placed.push({x:q.x,y:q.y,w:w}); return true;
  }
  function put(lat,lng,text,cls){
    var d=document.createElement('div'); d.className=cls; d.textContent=text;
    labels.push(new maplibregl.Marker({element:d,anchor:'top'}).setLngLat([lng,lat]).addTo(map));
  }
  spots.filter(valid).filter(function(s){return b.contains([s.lng,s.lat]);})
    .forEach(function(s){ if(room(s.lat,s.lng,s.n))put(s.lat,s.lng,s.n,'lbl'); });
  if(z>=15){
    var c=map.getCenter(), n=0;
    pois.filter(valid).filter(function(p){return b.contains([p.lng,p.lat]);})
      .sort(function(a,x){return Math.hypot(a.lat-c.lat,a.lng-c.lng)-Math.hypot(x.lat-c.lat,x.lng-c.lng);})
      .forEach(function(p){ if(n<60&&room(p.lat,p.lng,p.n)){put(p.lat,p.lng,p.n,'lbl2');n++;} });
  }
 }catch(e){}
}
map.on('moveend',drawLabels);

const cf=document.getElementById('confirm');
const cfName=document.getElementById('cf-name'), cfAsk=document.getElementById('cf-ask');
let dropMarker=null, askSeq=0;

function startPlacing(lat,lng,opt){
 try{
  opt=opt||{};
  if(!isFinite(lat)||!isFinite(lng))return;
  if(dropMarker){dropMarker.remove();dropMarker=null;}
  placing=Object.assign({lat:lat,lng:lng,place:null},opt);
  var d=document.createElement('div'); d.className='drop'; d.innerHTML='<i></i>';
  dropMarker=new maplibregl.Marker({element:d,draggable:true,anchor:'bottom'})
    .setLngLat([lng,lat]).addTo(map);
  dropMarker.on('dragend',function(){
    var p=dropMarker.getLngLat(); movePlacing(p.lat,p.lng,true);
  });
  document.body.classList.add('placing');
  cf.classList.add('on'); cf.classList.remove('pick');
  map.easeTo({center:[lng,lat],zoom:Math.max(map.getZoom(),16),duration:500});
  askPlace(lat,lng);
 }catch(e){ showErr('[startPlacing] '+dump(e)); }
}
function movePlacing(lat,lng,fromDrag){
  if(!placing)return;
  placing.lat=lat;placing.lng=lng;
  if(!fromDrag&&dropMarker)dropMarker.setLngLat([lng,lat]);
  cf.classList.remove('pick');
  askPlace(lat,lng);
}
async function askPlace(lat,lng){
 try{
  var my=++askSeq;
  cfName.textContent='場所を調べています…';
  cfAsk.textContent='この場所でいいですか？';
  var r=await revGeo(lat,lng);
  if(my!==askSeq||!placing)return;
  placing.place=r.name;
  if(r.near&&!placing.known)placing.known=r.near.n;
  cfName.textContent=r.name;
  var extra=[placing.gname,placing.budget].filter(Boolean).join('　');
  cfAsk.textContent=extra||(r.near?('近く：'+r.near.n):'この場所でいいですか？');
 }catch(e){ showErr('[askPlace] '+dump(e)); }
}
function endPlacing(){
  if(dropMarker){dropMarker.remove();dropMarker=null;}
  placing=null; cf.classList.remove('on','pick');
  document.body.classList.remove('placing');
}
document.getElementById('cf-yes').onclick=function(){
  if(!placing)return; var p=placing; endPlacing(); openAdd(p);
};
document.getElementById('cf-no').onclick=function(){
  if(!placing)return;
  cf.classList.add('pick');
  cfName.textContent='地図をタップして、正しい場所を選んでください';
  cfAsk.textContent='ピンを長押しして動かすこともできます';
};
document.getElementById('cf-cancel').onclick=endPlacing;

/** 地図に元から描かれている店の種類を、こちらの分類に置き換える */
function baseCat(p){
  var c=((p.class||'')+'/'+(p.subclass||'')).toLowerCase();
  if(/cafe|coffee|tea/.test(c))                       return '喫茶';
  if(/bar|pub|alcohol|sake|nightclub/.test(c))        return '酒';
  if(/restaurant|fast_food|food|noodle|ramen/.test(c))return '食';
  if(/park|garden|playground/.test(c))                return '園';
  if(/worship|shinto|temple|shrine|buddhis/.test(c))  return '社';
  if(/book|library/.test(c))                          return '本';
  if(/onsen|spa|bath|sauna/.test(c))                  return '湯';
  return '景';
}

/** 指先の周りを調べて、一番近いものを選ぶ（円ぴったりだと押せないため） */
function pickAt(e){
  var pad=18;
  var box=[[e.point.x-pad,e.point.y-pad],[e.point.x+pad,e.point.y+pad]];
  var feats=[];
  try{ feats=map.queryRenderedFeatures(box); }catch(_){ return null; }
  var best=null,bestScore=1e9,bestKind=null;
  for(var i=0;i<feats.length;i++){
    var f=feats[i];
    if(!f.geometry||f.geometry.type!=='Point')continue;
    var kind = f.layer.id==='pin' ? 'mine'
             : f.layer.id==='poi' ? 'ours'
             : (f.sourceLayer==='poi' && f.properties && f.properties.name) ? 'base'
             : null;
    if(!kind)continue;
    var pt=map.project(f.geometry.coordinates);
    var d=Math.hypot(pt.x-e.point.x,pt.y-e.point.y);
    // 自分の記録はわずかに優先（重なっている時のため）
    var score=d-(kind==='mine'?5:0);
    if(score<bestScore){bestScore=score;best=f;bestKind=kind;}
  }
  return best?{f:best,kind:bestKind}:null;
}

map.on('click',function(e){
  if(placing){ movePlacing(e.lngLat.lat,e.lngLat.lng); return; }
  var hit=pickAt(e);
  if(hit){
    var f=hit.f, c=f.geometry.coordinates, pr=f.properties||{};
    if(hit.kind==='mine'){
      var s=spots.filter(function(x){return x.id===pr.id;})[0];
      if(s){ openDetail(s); return; }
    }else if(hit.kind==='ours'){
      startPlacing(c[1],c[0],{known:pr.n,cat:pr.c,gname:pr.gname,budget:pr.budget});
      return;
    }else{
      // 地図に元から載っている店・施設
      var nm=pr['name:ja']||pr.name_ja||pr.name;
      startPlacing(c[1],c[0],{known:nm,cat:baseCat(pr),gname:pr.subclass||pr.class||''});
      return;
    }
  }
  startPlacing(e.lngLat.lat,e.lngLat.lng,{});
});

/* 逆ジオコーディング */
const geoCache=new Map();
async function revGeo(lat,lng){
  var key=lat.toFixed(4)+','+lng.toFixed(4);
  if(geoCache.has(key))return geoCache.get(key);
  var near=null,nd=1e9;
  pois.concat(spots).forEach(function(p){
    if(!valid(p))return;
    var d=Math.hypot((p.lat-lat)*111000,(p.lng-lng)*91000);
    if(d<nd){nd=d;near=p;}
  });
  if(nd>90)near=null;
  var name=null;
  try{
    var u='https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=ja&lat='+lat+'&lon='+lng;
    var res=await fetch(u);
    if(res.ok){
      var j=await res.json(), a=j.address||{};
      var seq=[a.province||a.state,a.city||a.town||a.village||a.county,
               a.city_district||a.suburb,a.neighbourhood||a.quarter,a.road], out=[];
      seq.forEach(function(v){if(v&&out.indexOf(v)<0)out.push(v);});
      if(out.length)name=out.join('');
      if(j.name&&name&&name.indexOf(j.name)<0)name=j.name+'（'+name+'）';
      else if(j.name&&!name)name=j.name;
    }
  }catch(e){}
  if(!name&&near)name=near.n+' のあたり';
  if(!name)name='緯度 '+lat.toFixed(5)+' / 経度 '+lng.toFixed(5);
  var out2={name:name,near:near};
  geoCache.set(key,out2);
  return out2;
}

const qEl=document.getElementById('q'), resEl=document.getElementById('results'), qx=document.getElementById('qx');
let qTimer=null;

qEl.addEventListener('input',function(){

},{passive:true});

async function runSearch(v){
  if(!v)return;
  var out=[];
  /* ① いま持っているもの */
  var mine=spots.filter(function(s){return s.n.indexOf(v)>=0;}).slice(0,3);
  mine.forEach(function(s){out.push({kind:'記録',ic:'●',n:s.n,sub:s.place||'',lat:s.lat,lng:s.lng,spot:s});});
  pois.filter(function(p){return p.n.indexOf(v)>=0;}).slice(0,3).forEach(function(p){
    out.push({kind:'地図',ic:'○',n:p.n,sub:p.gname||'',lat:p.lat,lng:p.lng,poi:p});});
  render(out,'検索中…');

  var c=map.getCenter();
  /* ② 店をホットペッパーから */
  try{
    var r=await fetch('/api/hotpepper?keyword='+encodeURIComponent(v)+
      '&lat='+c.lat+'&lng='+c.lng+'&range=5&pages=1');
    var j=await r.json();
    (j.shops||[]).slice(0,6).forEach(function(s){
      out.push({kind:'店',ic:'食',n:s.n,sub:[s.gname,s.addr].filter(Boolean).join('　'),
        lat:s.lat,lng:s.lng,poi:{n:s.n,c:HP_CAT[s.genre]||'食',lat:s.lat,lng:s.lng,gname:s.gname,budget:s.budget}});
    });
  }catch(e){}
  /* ③ 地名を Nominatim から */
  try{
    var r2=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5'+
      '&accept-language=ja&countrycodes=jp&q='+encodeURIComponent(v));
    var j2=await r2.json();
    (j2||[]).forEach(function(p){
      out.push({kind:'地名',ic:'地',n:p.name||p.display_name.split(',')[0],
        sub:p.display_name,lat:Number(p.lat),lng:Number(p.lon)});
    });
  }catch(e){}

  render(out,null);
}

function render(list,note){
  if(!list.length&&!note){resEl.innerHTML='<div class="reshead">見つかりませんでした</div>';resEl.classList.add('on');return;}
  var html = note?'<div class="reshead">'+note+'</div>':'';
  list.forEach(function(r,i){
    html+='<div class="res" data-i="'+i+'">'+
      '<span class="ic">'+esc(r.ic)+'</span>'+
      '<span class="tx"><b>'+esc(r.n)+'</b><span>'+esc(r.sub||'')+'</span></span>'+
      '<span class="kind">'+esc(r.kind)+'</span></div>';
  });
  resEl.innerHTML=html;
  resEl.classList.add('on');
  Array.prototype.forEach.call(resEl.querySelectorAll('.res'),function(el){
    el.onclick=function(){
      var r=list[Number(el.dataset.i)];
      resEl.classList.remove('on'); qEl.blur();
      map.easeTo({center:[r.lng,r.lat],zoom:17,duration:800});
      if(r.spot){ setTimeout(function(){openDetail(r.spot);},850); return; }
      if(r.poi){
        if(!pois.some(function(p){return p.n===r.poi.n&&Math.abs(p.lat-r.poi.lat)<1e-5;})){
          pois.push(r.poi); refresh();
        }
        setTimeout(function(){startPlacing(r.lat,r.lng,{known:r.poi.n,cat:r.poi.c,
          gname:r.poi.gname,budget:r.poi.budget});},850);
      }
    };
  });
}

const GEO_ERR={1:'許可されていません',2:'位置を特定できません（屋内など）',3:'時間内に取得できませんでした'};
document.getElementById('btn-loc').onclick=function(){
  var btn=this;
  if(!navigator.geolocation){setTip('この端末では取得できません');return;}
  btn.classList.add('act'); setTip('現在地を取得中…');
  function ok(p,mode){
    var lat=p.coords.latitude,lng=p.coords.longitude,acc=p.coords.accuracy;
    map.easeTo({center:[lng,lat],zoom:acc>2000?14:17,duration:900});
    if(meMarker)meMarker.remove();
    var d=document.createElement('div');
    d.style.cssText='width:15px;height:15px;border-radius:50%;background:#3E9B9B;'+
      'border:2px solid #fff;box-shadow:0 0 0 6px rgba(62,155,155,.25),0 0 18px rgba(62,155,155,.8)';
    meMarker=new maplibregl.Marker({element:d}).setLngLat([lng,lat]).addTo(map);
    setTip('現在地 ／誤差 約'+Math.round(acc)+'m（'+mode+'）');
    btn.classList.remove('act');
  }
  function fail(err){btn.classList.remove('act');
    setTip('取得失敗 ['+err.code+'] '+(GEO_ERR[err.code]||err.message));}
  navigator.geolocation.getCurrentPosition(function(p){ok(p,'高精度');},function(){
    navigator.geolocation.getCurrentPosition(function(p){ok(p,'通常');},fail,
      {enableHighAccuracy:false,timeout:25000,maximumAge:600000});
  },{enableHighAccuracy:true,timeout:30000,maximumAge:0});
};

const TAGS=[

const ENDPOINTS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];

async function loadHotpepper(){
  var c=map.getCenter(), b=map.getBounds();
  var half=Math.abs(b.getNorth()-c.lat)*111000;
  var range=half<=300?1:half<=500?2:half<=1000?3:half<=2000?4:5;
  var res=await fetch('/api/hotpepper?lat='+c.lat+'&lng='+c.lng+'&range='+range+'&pages=3');
  var j=await res.json();
  if(j.error){showErr('[hotpepper] '+j.error);return 0;}
  var seen={}; pois.forEach(function(p){seen[p.n+p.lat.toFixed(4)]=1;});
  var n=0;
  (j.shops||[]).forEach(function(s){
    if(!isFinite(s.lat)||!isFinite(s.lng))return;
    var k=s.n+s.lat.toFixed(4); if(seen[k])return; seen[k]=1;
    pois.push({n:s.n,c:HP_CAT[s.genre]||'食',lat:s.lat,lng:s.lng,
      gname:s.gname,budget:s.budget,addr:s.addr}); n++;
  });
  if(j.available>j.count)setTip('この範囲に'+j.available+'件。拡大して押すと全部取れます');
  return n;
}
async function loadOSM(){
  var b=map.getBounds();
  var bbox=[b.getSouth().toFixed(5),b.getWest().toFixed(5),b.getNorth().toFixed(5),b.getEast().toFixed(5)].join(',');
  var q='[out:json][timeout:25];('+TAGS.map(function(t){
    return 'node["'+t[0]+'"="'+t[1]+'"]["name"]('+bbox+');';}).join('')+');out body 300;';
  for(var i=0;i<ENDPOINTS.length;i++){
    try{
      var res=await fetch(ENDPOINTS[i],{method:'POST',body:'data='+encodeURIComponent(q)});
      if(!res.ok)throw new Error('HTTP '+res.status);
      var j=await res.json();
      var seen={}; pois.forEach(function(p){seen[p.n+p.lat.toFixed(4)]=1;});
      var n=0;
      (j.elements||[]).forEach(function(e2){
        var nm=e2.tags&&e2.tags.name; if(!nm)return;
        var k=nm+e2.lat.toFixed(4); if(seen[k])return; seen[k]=1;
        var cat='景';
        for(var t=0;t<TAGS.length;t++){if(e2.tags[TAGS[t][0]]===TAGS[t][1]){cat=TAGS[t][2];break;}}
        pois.push({n:nm,c:cat,lat:e2.lat,lng:e2.lon}); n++;
      });
      return n;
    }catch(e){}
  }
  return 0;
}

function shrink(file,cb){
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var M=1600,sc=Math.min(1,M/Math.max(im.width,im.height));
      var cv=document.createElement('canvas');
      cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
      var cx=cv.getContext('2d'); cx.imageSmoothingQuality='high';
      cx.drawImage(im,0,0,cv.width,cv.height);
      cb(cv.toDataURL('image/jpeg',.86));
    };
    im.onerror=function(){cb(null);};
    im.src=r.result;
  };
  r.readAsDataURL(file);
}

/** ログイン済みなら Authorization 付きで叩く */
async function api(path,opt){
  opt=opt||{};
  var headers=Object.assign({},opt.headers||{});
  if(fbUser){
    var t=await fbUser.getIdToken();
    headers['Authorization']='Bearer '+t;
  }
  return fetch(path,Object.assign({},opt,{headers:headers}));
}

async function loadMe(){
  try{
    var r=await api('/api/me');
    if(!r.ok){ setTip('サーバー応答 '+r.status); return; }
    meProfile=await r.json();
  }catch(e){ setTip('通信できませんでした'); }
}

function signIn(){
  var pv=new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(pv).catch(function(e){
    // ポップアップが塞がれる端末ではリダイレクトに切り替える
    if(e&&/popup/i.test(e.code||'')){
      firebase.auth().signInWithRedirect(pv);
    }else{
      setTip('ログイン失敗: '+(e&&e.code||e));
    }
  });
}
