<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Spota</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<link rel="stylesheet" href="/app.css">
</head>
<div id="err"></div>
<div id="splash">
  <div class="sp-in">
    <svg viewBox="0 0 100 100" class="sp-mark">
      <rect x="24" y="22" width="52" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="5"/>
      <path d="M36 22v56" stroke="currentColor" stroke-width="5"/>
      <path d="M58 34c6.6 0 12 5.4 12 12 0 8.2-12 20-12 20S46 54.2 46 46c0-6.6 5.4-12 12-12z" fill="currentColor"/>
      <circle cx="58" cy="46" r="4.6" fill="var(--bg)"/>
    </svg>
    <div class="sp-nm">Spota</div>
    <div class="sp-sb">地図に、思い出を。</div>
  </div>
</div>

<div id="map"></div>

<div class="top">
  <div class="q">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
    <input id="q" placeholder="店名・地名で探す" autocomplete="off" enterkeyhint="search">
    <button class="x" id="qx">✕</button>
  </div>
</div>
<div class="results" id="results"></div>

<div class="fabpull" id="fabpull"><b></b></div>

<nav class="fabs" id="fabs">
  <div class="rim"></div>
  <div class="sheen"></div>
  <div class="glare-wrap"><div class="glare" id="glare"></div></div>

  <div class="nav-items">
    <div class="pill" id="pill"></div>

    <button class="nav-btn" id="btn-loc" data-i="0">
      <div class="bc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        <span>現在地</span>
      </div>
    </button>

    <button class="nav-btn" id="btn-bulk" data-i="1">
      <div class="bc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h14v14H7z"/><path d="M17 17.5v3H3v-14h3"/><path d="M7 14l4-3.5 3 2.5 2.5-2 4.5 4"/></svg>
        <span>まとめて</span>
      </div>
    </button>

    <button class="cam" id="btn-cam">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5h4L8.5 5.5h7L17 7.5h4v12H3z"/><circle cx="12" cy="13" r="3.6"/></svg>
    </button>

    <button class="nav-btn" id="btn-lib" data-i="2">
      <div class="bc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5h18v13H3z"/><path d="M3 15l5-4 4 3 3-3 6 5"/><circle cx="8.5" cy="9" r="1.3"/></svg>
        <span>写真</span>
      </div>
    </button>

    <button class="nav-btn" id="btn-me" data-i="3">
      <div class="bc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <span>じぶん</span>
      </div>
    </button>
  </div>

  <div class="divider"></div>

  <button class="theme-btn" id="btn-night">
    <div class="theme-icon">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </div>
  </button>
</nav>

<div class="tip" id="tip">地図をタップして、思い出を追加</div>

<div class="confirm" id="confirm">
  <span class="cf-name" id="cf-name">場所を調べています…</span>
  <span class="cf-ask" id="cf-ask">この場所でいいですか？</span>
  <div class="cf-btns"><button id="cf-no">いいえ</button><button class="y" id="cf-yes">はい</button></div>
  <button class="cf-cancel" id="cf-cancel">やめる</button>
</div>

<div class="scrim" id="scrim"></div>
<input type="file" accept="image/*" capture="environment" hidden id="in-cam">
<input type="file" accept="image/*" multiple hidden id="in-lib">
<input type="file" accept="image/*" multiple hidden id="in-bulk">


<script src="/boot.js?v=82"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="/lazy.js"></script>

<!-- 中身。役割ごとに分けてある。
     読む順番には意味があるので、入れ替えないこと -->
<script src="/core.js"></script>    <!-- 設定・道具・端末内の保存 -->
<script src="/map.js?v=82"></script>     <!-- 地図・配色・ピン -->
<script src="/place.js"></script>   <!-- 場所のシート・写真を開く -->
<script src="/data.js"></script>    <!-- 外部からの取り込み・検索 -->
<script src="/native.js"></script>  <!-- カメラ・現在地・通知 -->
<script src="/post.js"></script>    <!-- 記録する・まとめて取り込む -->
<script src="/sync.js"></script>    <!-- サーバー保存・タグ・ログイン -->
<script src="/ui.js?v=82"></script>      <!-- スワイプ・ズーム・バナー・診断 -->
</body>
</html>
