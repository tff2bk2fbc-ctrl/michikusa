<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#EFEDE8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spota">
<title>Spota</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" integrity="sha384-K282sW/zFjTkrjR/+yr1H+gCukuy4OEYrkXRybV88g7pk+kZZYpNV6SAV59NcgFg" crossorigin="anonymous">
<link rel="stylesheet" href="/app.css?v=92">
</head>
<div id="err"></div>
<div id="splash">
  <div class="sp-in">
    <img src="/icon-192.png?v=86" class="sp-mark" id="sp-icon" alt="">
    <div class="sp-nm">Spota</div>
    <div class="sp-sb">地図に、思い出を。</div>
  </div>
</div>

<div id="map"></div>

<div class="top">
  <div class="q">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
    <input id="q" placeholder="店名・地名で探す" autocomplete="off" enterkeyhint="search">
    <button class="x" id="qx">✕</button>
  </div>
</div>
<div class="results" id="results"></div>

<div class="fabpull" id="fabpull"><b></b></div>

<nav class="fabs" id="fabs" aria-label="主要な操作">
  <div class="sheen"></div>

  <div class="nav-items">
    <div class="pill" id="pill"></div>

    <button class="nav-btn" id="btn-loc" data-i="0" aria-label="現在地">
      <div class="bc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        <span class="sr-only">現在地</span>
      </div>
    </button>

    <button class="nav-btn" id="btn-bulk" data-i="1" aria-label="思い出アルバム">
      <div class="bc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h6l1.6 2H20v11H4z"/><path d="M7 15l3-2.6 2.5 2 2.1-1.7L18 15.5"/><circle cx="9" cy="10.5" r="1"/></svg>
        <span class="sr-only">思い出</span>
      </div>
    </button>

    <button class="cam" id="btn-cam" aria-label="カメラ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5h4L8.5 5.5h7L17 7.5h4v12H3z"/><circle cx="12" cy="13" r="3.6"/></svg>
    </button>

    <button class="nav-btn" id="btn-lib" data-i="2" aria-label="写真">
      <div class="bc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5h18v13H3z"/><path d="M3 15l5-4 4 3 3-3 6 5"/><circle cx="8.5" cy="9" r="1.3"/></svg>
        <span class="sr-only">写真</span>
      </div>
    </button>

    <button class="nav-btn" id="btn-me" data-i="3" aria-label="プロフィール">
      <div class="bc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <span class="sr-only">プロフィール</span>
      </div>
    </button>
  </div>

</nav>

<div class="tip" id="tip">地図をタップして、思い出を追加</div>

<div class="confirm" id="confirm">
  <span class="cf-name" id="cf-name">場所を調べています…</span>
  <span class="cf-ask" id="cf-ask">この場所でいいですか？</span>
  <div class="cf-btns"><button id="cf-no">いいえ</button><button class="y" id="cf-yes">はい</button></div>
  <button class="cf-cancel" id="cf-cancel">やめる</button>
</div>

<div class="scrim" id="scrim"></div>
<input type="file" accept="image/*" capture="environment" hidden id="in-cam">
<input type="file" accept="image/*" multiple hidden id="in-lib">
<input type="file" accept="image/*" multiple hidden id="in-bulk">


<script src="/boot.js?v=92"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js" integrity="sha384-KKgyz2mG25bKJ1O2PyqTJPlAF8Kw2BpDmsLTNBXslICOBvhTAyF5F0XhLWF2ZovY" crossorigin="anonymous"></script>
<script src="/lazy.js?v=84"></script>

<!-- 中身。役割ごとに分けてある。
     読む順番には意味があるので、入れ替えないこと -->
<script src="/core.js?v=91"></script>    <!-- 設定・道具・端末内の保存 -->
<script src="/map.js?v=87"></script>     <!-- 地図・配色・ピン -->
<script src="/place.js?v=92"></script>   <!-- 場所のシート・写真を開く -->
<script src="/data.js"></script>    <!-- 外部からの取り込み・検索 -->
<script src="/native.js?v=92"></script>  <!-- カメラ・現在地・通知 -->
<script src="/post.js?v=91"></script>    <!-- 記録する・思い出アルバム -->
<script src="/sync.js?v=91"></script>    <!-- サーバー保存・タグ・ログイン -->
<script src="/ui.js?v=91"></script>      <!-- スワイプ・ズーム・バナー・診断 -->
</body>
</html>
