<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111c">
<title>Island Ace Golf</title>
<style>
:root{--bg:#07111c;--panel:rgba(7,17,28,.86);--line:rgba(255,255,255,.12);--text:#f3fbff;--muted:#98afbd;--mint:#7df9c2;--gold:#ffd166;--bad:#ff7b86}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111c;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;background:rgba(4,13,22,.96);border-bottom:1px solid var(--line)}.logo{font-weight:900;letter-spacing:.08em;white-space:nowrap}.logo b{color:var(--mint)}.chips{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}.chip{font-size:11px;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);white-space:nowrap}.stage{position:relative;min-height:0}canvas{display:block;width:100%;height:100%;touch-action:none;background:#9edcff}.panel{position:absolute;left:10px;top:10px;width:min(335px,76vw);padding:11px 12px;border-radius:15px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);box-shadow:0 12px 30px rgba(0,0,0,.22);pointer-events:none}.panel b{color:white}.status{font-size:13px;line-height:1.45}.sub{font-size:10px;color:var(--muted);margin-top:5px}.meter{height:7px;background:#203746;border-radius:999px;overflow:hidden;margin-top:7px}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--gold),#ff766d)}.rank{position:absolute;right:10px;top:10px;width:240px;max-height:45vh;overflow:auto;padding:10px;border-radius:15px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px)}.rank h3{font-size:13px;margin:0 0 7px}table{border-collapse:collapse;width:100%;font-size:11px}th,td{padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left}th:last-child,td:last-child{text-align:right}.help{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(720px,94%);padding:10px 12px;border-radius:14px;background:rgba(4,13,22,.84);border:1px solid var(--line);font-size:11px;line-height:1.45;pointer-events:none;backdrop-filter:blur(10px)}.toast{position:absolute;left:50%;top:20%;transform:translate(-50%,-10px);opacity:0;transition:.22s;padding:12px 16px;border-radius:14px;background:rgba(3,11,18,.93);border:1px solid var(--line);font-size:19px;font-weight:900;white-space:nowrap;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.bottom{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 10px;background:rgba(4,13,22,.97);border-top:1px solid var(--line)}input{width:105px;padding:8px 9px;border-radius:10px;border:1px solid #314b5e;background:#0e1d29;color:white}button{appearance:none;border:0;border-radius:11px;padding:8px 11px;background:#213a4d;color:white;font-weight:800}button.primary{background:var(--mint);color:#062018}button.danger{background:#482630}.footnote{margin-left:auto;font-size:10px;color:var(--muted)}@media(max-width:720px){.rank{display:none}.help{font-size:10px}.panel{width:80vw}.footnote{display:none}}
</style>
</head>
<body>
<div id="app">
  <div class="top"><div class="logo">ISLAND <b>ACE</b></div><div class="chips"><span class="chip">PAR 3 · 145 m</span><span class="chip" id="windChip">風 --</span><span class="chip" id="bestChip">BEST --</span></div></div>
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="panel"><div class="status" id="status"><b>腕を振って打て。</b><br>選手の近くから上方向へスワイプ。</div><div class="sub" id="shotInfo">PATH -- / FACE -- / SPIN --</div><div class="meter"><i id="power"></i></div></div>
    <div class="rank"><h3>この端末ランキング</h3><table><thead><tr><th>#</th><th>NAME</th><th>RESULT</th></tr></thead><tbody id="rows"></tbody></table></div>
    <div class="help" id="help"><b>操作：</b>画面下の選手付近からターゲット方向へ一気に振り抜く。左へ抜く＝OUT→IN、真っすぐ＝ライン出し、右へ抜く＝IN→OUT。振る速さで初速、最後の向きでフェース角が変わる。</div>
    <div class="toast" id="toast"></div>
  </div>
  <div class="bottom"><input id="name" maxlength="12" value="PLAYER"><button class="primary" id="next">次の1球</button><button id="wind">風を変える</button><button class="danger" id="clear">記録消去</button><span class="footnote">localStorage保存 · 右打ち</span></div>
</div>
<script>
(()=>{
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d'),statusEl=document.getElementById('status'),shotInfo=document.getElementById('shotInfo'),powerEl=document.getElementById('power'),windChip=document.getElementById('windChip'),bestChip=document.getElementById('bestChip'),rows=document.getElementById('rows'),nameEl=document.getElementById('name'),toast=document.getElementById('toast'),help=document.getElementById('help');
const KEY='islandAceScoresV4',G=9.81,HOLE=145,RX=24,RY=31,DT=1/120,DRAG=.00105,MAGNUS=.000010,SLOPEX=.022,SLOPEY=-.014,FRIC=1.48,CUP=.19;
let W=0,H=0,DPR=1,state='ready',swing=null,wind={x:0,y:0},ball,trail=[],scores=load(),arm=-.75,last=performance.now(),acc=0;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function rad(d){return d*Math.PI/180}function rand(a,b){return a+Math.random()*(b-a)}function h3(x,y,z){return Math.sqrt(x*x+y*y+z*z)}
function resize(){const r=cvs.getBoundingClientRect();DPR=Math.min(2,devicePixelRatio||1);cvs.width=Math.round(r.width*DPR);cvs.height=Math.round(r.height*DPR);W=r.width;H=r.height;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function pos(x,y,z=0){const top=H*.18,bottom=H*.93,p=clamp(y,0,200)/200,sy=bottom-(bottom-top)*Math.pow(p,.8)-z*3.1*(1-p*.28),scale=8.8*(1-p*.67);return[x?W/2+x*scale:W/2,sy,scale]}
function newWind(){const s=rand(.4,4.2),a=rand(-Math.PI,Math.PI);wind={x:Math.cos(a)*s,y:Math.sin(a)*s};const ar=Math.abs(wind.x)>Math.abs(wind.y)?(wind.x>0?'→':'←'):(wind.y>0?'↑':'↓');windChip.textContent=`風 ${s.toFixed(1)} m/s ${ar}`}
function reset(){state='ready';swing=null;trail=[];arm=-.75;ball={x:0,y:0,z:.05,vx:0,vy:0,vz:0,sx:0,sz:0};statusEl.innerHTML='<b>腕を振って打て。</b><br>選手付近から上へ一気にスワイプ。';shotInfo.textContent='PATH -- / FACE -- / SPIN --';powerEl.style.width='0%';help.style.opacity='1'}
function sky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#6cc7f4');g.addColorStop(.5,'#c2ecff');g.addColorStop(.505,'#187eaa');g.addColorStop(1,'#095276');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.3;ctx.fillStyle='#fff';for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse((80+i*W*.28)%W,55+(i%2)*27,65,15,0,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function course(){ctx.strokeStyle='rgba(255,255,255,.13)';ctx.lineWidth=1;for(let i=0;i<10;i++){const yy=H*.54+i*33;ctx.beginPath();for(let x=0;x<W;x+=14){const y=yy+Math.sin(x*.025+i)*2;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}const t=pos(0,0);ctx.fillStyle='#29934d';ctx.beginPath();ctx.ellipse(t[0],t[1]+18,96,26,0,0,Math.PI*2);ctx.fill();const c=pos(0,HOLE),ex=RX*c[2],ey=RY*(H*.73/200)*.88;ctx.fillStyle='#b99c68';ctx.beginPath();ctx.ellipse(c[0],c[1]+6,ex*1.1,ey*1.12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3ca65e';ctx.beginPath();ctx.ellipse(c[0],c[1],ex,ey,0,0,Math.PI*2);ctx.fill();const sg=ctx.createLinearGradient(c[0]-ex,c[1]-ey,c[0]+ex,c[1]+ey);sg.addColorStop(0,'rgba(255,255,255,.17)');sg.addColorStop(1,'rgba(0,0,0,.18)');ctx.fillStyle=sg;ctx.beginPath();ctx.ellipse(c[0],c[1],ex,ey,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(c[0],c[1]+2,5,2.2,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(c[0],c[1]+2);ctx.lineTo(c[0],c[1]-50);ctx.stroke();ctx.fillStyle='#ff445a';ctx.beginPath();ctx.moveTo(c[0],c[1]-50);ctx.lineTo(c[0]+31,c[1]-39);ctx.lineTo(c[0],c[1]-29);ctx.fill();ctx.fillStyle='rgba(5,25,20,.72)';ctx.fillRect(c[0]+45,c[1]-27,92,30);ctx.fillStyle='white';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText('傾斜 ↖ 2.6%',c[0]+91,c[1]-13);ctx.fillText('9.5 ft想定',c[0]+91,c[1])}
function golfer(){const p=pos(-7,2),x=p[0],y=p[1]-8;ctx.lineCap='round';ctx.strokeStyle='#202a34';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x-5,y-30);ctx.lineTo(x-14,y);ctx.moveTo(x+4,y-30);ctx.lineTo(x+13,y);ctx.stroke();ctx.strokeStyle='#f4f7fa';ctx.lineWidth=15;ctx.beginPath();ctx.moveTo(x,y-72);ctx.lineTo(x,y-31);ctx.stroke();ctx.fillStyle='#e2ae88';ctx.beginPath();ctx.arc(x,y-88,10,0,Math.PI*2);ctx.fill();const sx=x,sy=y-66,e={x:sx+Math.cos(arm)*28,y:sy+Math.sin(arm)*28},h={x:e.x+Math.cos(arm+.25)*33,y:e.y+Math.sin(arm+.25)*33};ctx.strokeStyle='#e2ae88';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(e.x,e.y);ctx.lineTo(h.x,h.y);ctx.stroke();ctx.strokeStyle='#27313a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(h.x,h.y);ctx.lineTo(h.x+Math.cos(arm+.35)*54,h.y+Math.sin(arm+.35)*54);ctx.stroke()}
function swingLine(){if(!swing)return;ctx.strokeStyle='rgba(125,249,194,.9)';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();swing.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}
function drawBall(){if(trail.length>1){ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.beginPath();trail.forEach((p,i)=>{const s=pos(p.x,p.y,p.z);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1])});ctx.stroke()}const s=pos(ball.x,ball.y,ball.z),r=clamp(7*(1-ball.y/250),3.2,7);ctx.fillStyle='white';ctx.beginPath();ctx.arc(s[0],s[1],r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.stroke()}
function render(){sky();course();golfer();swingLine();drawBall()}
function pp(e){const r=cvs.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,t:performance.now()}}
cvs.addEventListener('pointerdown',e=>{if(state!=='ready')return;const p=pp(e);if(p.y<H*.48)return;state='aiming';swing={start:p,pts:[p]};help.style.opacity='.12';cvs.setPointerCapture(e.pointerId)});
cvs.addEventListener('pointermove',e=>{if(state!=='aiming'||!swing)return;const p=pp(e);swing.pts.push(p);const dx=p.x-swing.start.x,dy=p.y-swing.start.y;arm=Math.atan2(dy,dx)-.55;powerEl.style.width=clamp(Math.hypot(dx,dy)/240*100,0,100)+'%'});
cvs.addEventListener('pointerup',e=>{if(state!=='aiming'||!swing)return;swing.pts.push(pp(e));hit(swing);swing=null});
function hit(sw){const p=sw.pts,a=p[0],b=p[p.length-1],dx=b.x-a.x,dy=b.y-a.y,elapsed=Math.max(70,b.t-a.t)/1000,len=Math.hypot(dx,dy);if(len<65||dy>-25){state='ready';pop('振りが小さいで！');return}const path=clamp(dx/Math.max(90,-dy)*18,-12,12),q=p[Math.max(0,p.length-4)],edx=b.x-q.x,edy=b.y-q.y,face=clamp(edx/Math.max(12,-edy)*11,-10,10),ftp=face-path,pxs=len/elapsed,power=clamp((pxs-250)/1050,.45,1),speed=40.5+10.5*power,launch=18.5+2.2*(1-power),dir=rad(face*.78+path*.22),vh=speed*Math.cos(rad(launch)),back=4200+2600*power,side=clamp(ftp*430,-4200,4200);ball={x:0,y:0,z:.05,vx:vh*Math.sin(dir),vy:vh*Math.cos(dir),vz:speed*Math.sin(rad(launch)),sx:back*2*Math.PI/60,sz:-side*2*Math.PI/60};trail=[];state='flying';const pn=path<-2.5?'OUT→IN':path>2.5?'IN→OUT':'LINE',sn=side>650?'FADE':side<-650?'DRAW':'STRAIGHT';statusEl.innerHTML=`<b>${pn} / ${sn}</b><br>初速 ${speed.toFixed(1)} m/s · 打出し ${launch.toFixed(1)}°`;shotInfo.textContent=`PATH ${path.toFixed(1)}° / FACE ${face.toFixed(1)}° / SIDE ${Math.round(side)} rpm`;powerEl.style.width=Math.round(power*100)+'%'}
function island(x,y){const nx=x/RX,ny=(y-HOLE)/RY;return nx*nx+ny*ny<=1}
function step(dt){if(state==='flying'){const rx=ball.vx-wind.x,ry=ball.vy-wind.y,rz=ball.vz,s=h3(rx,ry,rz);let ax=-DRAG*s*rx,ay=-DRAG*s*ry,az=-G-DRAG*s*rz;const mx=-ball.sz*ry,my=ball.sz*rx-ball.sx*rz,mz=ball.sx*ry;ax+=MAGNUS*mx;ay+=MAGNUS*my;az+=MAGNUS*mz;ball.vx+=ax*dt;ball.vy+=ay*dt;ball.vz+=az*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.z+=ball.vz*dt;ball.sx*=Math.pow(.997,dt*120);ball.sz*=Math.pow(.996,dt*120);if(Math.random()<.12)trail.push({x:ball.x,y:ball.y,z:ball.z});if(trail.length>90)trail.shift();if(ball.z<=0&&ball.vz<0){ball.z=0;if(island(ball.x,ball.y)){const im=Math.abs(ball.vz);if(im>5.5){ball.vz=im*.16;ball.vx*=.72;ball.vy*=.72}else{ball.vz=0;ball.vx*=.48;ball.vy*=.48;state='rolling'}}else{state='done';finish('water')}}if(ball.y>205||Math.abs(ball.x)>85){state='done';finish('water')}}else if(state==='rolling'){let ax=-G*SLOPEX,ay=-G*SLOPEY,s=Math.hypot(ball.vx,ball.vy);if(s>.02){ax-=FRIC*ball.vx/s;ay-=FRIC*ball.vy/s}ball.vx+=ax*dt;ball.vy+=ay*dt;if(s<.12){ball.vx*=.9;ball.vy*=.9}ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const d=Math.hypot(ball.x,ball.y-HOLE),rs=Math.hypot(ball.vx,ball.vy);if(d<CUP&&rs<2.6){ball.x=0;ball.y=HOLE;ball.vx=ball.vy=0;state='done';finish('ace');return}if(!island(ball.x,ball.y)){state='done';finish('water');return}if(rs<.06){ball.vx=ball.vy=0;state='done';finish('green')}}}
function finish(kind){const d=Math.hypot(ball.x,ball.y-HOLE),name=(nameEl.value||'PLAYER').trim().slice(0,12)||'PLAYER';if(kind==='ace'){pop('⛳ HOLE IN ONE!!!');statusEl.innerHTML='<b style="color:#ffd166">HOLE IN ONE!</b><br>カップイン。エグい。';add({name,ace:true,dist:0,t:Date.now()})}else if(kind==='green'){pop(d.toFixed(2)+' m');statusEl.innerHTML=`<b>グリーンオン</b><br>ピンまで ${d.toFixed(2)} m`;add({name,ace:false,dist:d,t:Date.now()})}else{pop('💦 WATER');statusEl.innerHTML='<b style="color:#ff8a8a">池ポチャ</b><br>島に乗らんかった。';add({name,ace:false,dist:999,water:true,t:Date.now()})}renderRank()}
function pop(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(){localStorage.setItem(KEY,JSON.stringify(scores.slice(0,60)))}function add(s){scores.push(s);scores.sort((a,b)=>!!a.ace!==!!b.ace?(a.ace?-1:1):a.dist-b.dist);scores=scores.slice(0,60);save()}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function renderRank(){rows.innerHTML='';scores.slice(0,10).forEach((s,i)=>{const tr=document.createElement('tr'),r=s.ace?'ACE':s.water?'WATER':s.dist.toFixed(2)+'m';tr.innerHTML=`<td>${i+1}</td><td>${esc(s.name)}</td><td>${r}</td>`;rows.appendChild(tr)});const b=scores.find(s=>!s.water);bestChip.textContent=b?'BEST '+(b.ace?'ACE':b.dist.toFixed(2)+'m'):'BEST --'}
document.getElementById('next').onclick=reset;document.getElementById('wind').onclick=()=>{newWind();reset()};document.getElementById('clear').onclick=()=>{if(confirm('この端末のランキングを全部消すで？')){scores=[];save();renderRank();reset()}};
newWind();reset();renderRank();function loop(t){const d=Math.min(.05,(t-last)/1000);last=t;acc+=d;while(acc>=DT){step(DT);acc-=DT}if(state==='flying')arm+=(.35-arm)*.05;render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>
</body>
</html>
